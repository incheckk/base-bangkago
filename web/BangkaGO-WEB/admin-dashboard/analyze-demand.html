<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Admin — Analyze Demand</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png" />

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin-theme.css"/>
  <style>
    .kpi-card{
      border:1px solid #d8dee8;
      border-radius:16px;
      padding:1rem;
      background:#fff;
      box-shadow:0 2px 10px rgba(16,24,40,.04);
      height:100%;
    }
    .kpi-value{font-size:2rem;font-weight:700;line-height:1.1}
    .kpi-sub{font-size:.95rem}
    .soft-bar{
      height:34px;border-radius:8px;
      background:linear-gradient(90deg,#cfe9dd,#a7d7bf);
    }
    .soft-bar.warn{background:linear-gradient(90deg,#efe7d3,#e5cf9f);}
    .panel-card{
      border:1px solid #d8dee8;border-radius:16px;background:#fff;
      box-shadow:0 2px 10px rgba(16,24,40,.04);
    }
    .action-btn{
      min-width:140px;height:38px;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border-radius:8px
    }
  </style>
</head>
<body data-page="analyze-demand">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">

        <!-- Use-case sub-features -->
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button class="btn btn-outline-primary action-btn" id="btnPredictions">
            <i class="bi bi-graph-up"></i> View Predictions
          </button>
          <button class="btn btn-outline-dark action-btn" id="btnTrends">
            <i class="bi bi-bar-chart"></i> View Trends
          </button>
          <button class="btn btn-bangkago action-btn" id="btnInsights">
            <i class="bi bi-lightbulb"></i> Generate Insights
          </button>
        </div>

        <!-- KPI Cards -->
        <div class="row g-3 mb-3" id="kpiCards">
          <!-- Loaded dynamically -->
        </div>

        <div class="row g-3">
          <div class="col-lg-8">
            <div class="panel-card p-3">
              <h4 class="mb-3">Demand by Route</h4>
              <div class="table-responsive">
                <table class="table table-theme align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Route</th>
                      <th>Avg Daily Predicted</th>
                      <th>Total Predicted</th>
                      <th>Days with Data</th>
                    </tr>
                  </thead>
                  <tbody id="routeDemandBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="panel-card p-3">
              <h4 class="mb-3">Recommendations</h4>
              <div id="recommendationsList"></div>
            </div>
          </div>
        </div>

        <div id="loadingState" class="text-center py-4 d-none">
          <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
          <p class="mt-2 text-muted">Loading demand data...</p>
        </div>
        
        <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
      </section>
    </main>
  </div>

  <!-- View Predictions Modal -->
  <div class="modal fade" id="predictionsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">View Predictions</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label fw-semibold" for="predictionDateSelect">Prediction Date</label>
          <select id="predictionDateSelect" class="form-select mb-3"></select>
          <div id="predictionsBody"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- View Trends Modal -->
  <div class="modal fade" id="trendsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">View Trends</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3" id="trendsContent">
            <!-- Loaded dynamically -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Generate Insights Modal -->
  <div class="modal fade" id="insightsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="insightForm">
        <div class="modal-header">
          <h5 class="modal-title">Generate Insights</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label">Select Focus Route</label>
          <select id="insightRoute" class="form-select mb-3">
            <option value="">Select a route...</option>
          </select>
          <div id="insightOutput" class="alert alert-info mb-0">
            Select a route and click <strong>Generate</strong> to produce recommendation.
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-bangkago">Generate</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../assets/js/services/supabase.js"></script>
  <script src="../../assets/js/services/demand.js"></script>
  <script src="../../assets/js/services/stats.js"></script>
  <script src="../../assets/js/services/bookings.js"></script>
  <script src="../../assets/js/services/realtime.js"></script>

  <script>
    const kpiCards = document.getElementById('kpiCards');
    const routeDemandBody = document.getElementById('routeDemandBody');
    const recommendationsList = document.getElementById('recommendationsList');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    const predictionsModal = new bootstrap.Modal(document.getElementById('predictionsModal'));
    const trendsModal = new bootstrap.Modal(document.getElementById('trendsModal'));
    const insightsModal = new bootstrap.Modal(document.getElementById('insightsModal'));

    document.getElementById('btnPredictions').addEventListener('click', () => { loadPredictions(); predictionsModal.show(); });
    document.getElementById('btnTrends').addEventListener('click', () => { loadTrends(); trendsModal.show(); });
    document.getElementById('btnInsights').addEventListener('click', () => { loadInsightRoutes(); insightsModal.show(); });

    function formatNumber(n) {
      return Number(n).toLocaleString('en-PH');
    }

    function showLoading(show) {
      loadingState.classList.toggle('d-none', !show);
      errorState.classList.add('d-none');
    }

    function showError(msg) {
      loadingState.classList.add('d-none');
      errorState.textContent = msg;
      errorState.classList.remove('d-none');
    }

    async function loadDemandData() {
      showLoading(true);
      try {
        const [summary, dateCount, stats] = await Promise.all([
          window.bangkagoDemand.getRouteDemandSummary(),
          window.bangkagoDemand.getPredictionDateCount(),
          window.bangkagoStats.getAdminStats()
        ]);

        renderKPIs(summary, dateCount, stats);
        renderRouteTable(summary);
        renderRecommendations(summary);
        showLoading(false);
      } catch (e) {
        console.error(e);
        showError('Failed to load demand data: ' + e.message);
      }
    }

    function renderKPIs(summary, dateCount, stats) {
      const totalPredicted = summary.reduce((sum, r) => sum + r.totalPredicted, 0);
      const topRoute = summary[0] || { routeName: '—', totalPredicted: 0 };
      const dailyAverage = dateCount > 0 ? Math.round(totalPredicted / dateCount) : 0;
      const hasData = summary.length > 0;
      const tripsToday = stats.tripsToday || 0;
      const completedToday = stats.completedTripsToday || 0;
      const activeToday = stats.activeTripsToday || 0;

      kpiCards.innerHTML = `
        <div class="col-lg-3 col-md-6">
          <div class="kpi-card">
            <div class="text-muted">7-Day Total Predicted</div>
            <div class="kpi-value">${formatNumber(totalPredicted)}</div>
            <div class="kpi-sub ${hasData ? 'text-success' : 'text-muted'}">${hasData ? `Across ${summary.length} routes` : 'No predictions yet'}</div>
            <div class="soft-bar mt-3"></div>
          </div>
        </div>
        <div class="col-lg-3 col-md-6">
          <div class="kpi-card">
            <div class="text-muted">Daily Average</div>
            <div class="kpi-value">${hasData ? '~' + formatNumber(dailyAverage) : '0'}</div>
            <div class="kpi-sub ${hasData ? 'text-success' : 'text-muted'}">${hasData ? 'per day' : 'No predictions yet'}</div>
            <div class="soft-bar mt-3"></div>
          </div>
        </div>
        <div class="col-lg-3 col-md-6">
          <div class="kpi-card">
            <div class="text-muted">Top Route</div>
            <div class="kpi-value">${topRoute.routeName}</div>
            <div class="kpi-sub ${hasData ? 'text-success' : 'text-muted'}">${hasData ? formatNumber(topRoute.totalPredicted) + ' predicted' : 'No predictions yet'}</div>
            <div class="soft-bar mt-3"></div>
          </div>
        </div>
        <div class="col-lg-3 col-md-6">
          <div class="kpi-card">
            <div class="text-muted">Trips Today</div>
            <div class="kpi-value">${formatNumber(tripsToday)} Trips</div>
            <div class="kpi-sub ${tripsToday ? 'text-success' : 'text-muted'}">${formatNumber(completedToday)} completed / ${formatNumber(activeToday)} active</div>
          </div>
        </div>
      `;
    }

    function renderRouteTable(summary) {
      routeDemandBody.innerHTML = summary.map(function(r) {
        return `
          <tr>
            <td>${r.routeName}</td>
            <td>${formatNumber(r.avgDailyPredicted)}</td>
            <td>${formatNumber(r.totalPredicted)}</td>
            <td>${formatNumber(r.daysWithData)}</td>
          </tr>
        `;
      }).join('') || '<tr><td colspan="4" class="text-center text-muted">No predictions yet. Data will appear after the ML model publishes predictions.</td></tr>';
    }

    function renderRecommendations(summary) {
      if (summary.length === 0) {
        recommendationsList.innerHTML = '<p class="text-muted">No predictions yet. Data will appear after the ML model publishes predictions.</p>';
        return;
      }

      const topRoute = summary[0];
      const lowRoute = summary[summary.length - 1];

      var html = '';
      if (topRoute) {
        html += `
          <div class="d-flex justify-content-between border-bottom py-2">
            <span>Add capacity on <strong>${topRoute.routeName}</strong> (highest total predicted demand)</span>
            <span class="text-muted">priority high</span>
          </div>
        `;
      }
      if (summary.length > 1) {
        html += `
          <div class="d-flex justify-content-between border-bottom py-2">
            <span>Maintain current fleet on <strong>${summary[1]?.routeName || 'other routes'}</strong></span>
            <span class="text-muted">priority normal</span>
          </div>
        `;
      }
      if (lowRoute && lowRoute !== topRoute) {
        html += `
          <div class="d-flex justify-content-between py-2">
            <span>Monitor <strong>${lowRoute.routeName}</strong> — low predicted demand (${formatNumber(lowRoute.avgDailyPredicted)}/day)</span>
            <span class="text-muted">priority low</span>
          </div>
        `;
      }
      recommendationsList.innerHTML = html;
    }

    let predictionRows = [];

    function formatPredictionDate(dateStr) {
      if (!dateStr) return 'Unknown date';
      var d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('en-US', {
        month: 'long',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function renderPredictionRows(date) {
      const predictionsBody = document.getElementById('predictionsBody');
      const rows = predictionRows.filter(function(p) {
        return (p.predictionDate || '') === date;
      });

      if (rows.length === 0) {
        predictionsBody.innerHTML = '<p class="text-center text-muted mb-0">No predictions yet. Data will appear after the ML model publishes predictions.</p>';
        return;
      }

      predictionsBody.innerHTML = `
        <div class="table-responsive">
          <table class="table table-theme align-middle mb-0">
            <thead>
              <tr>
                <th>Route</th>
                <th>Predicted Passengers</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(function(p) {
                return `
                  <tr>
                    <td>${p.routeId}</td>
                    <td>${formatNumber(p.predictedPassengers)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // Predictions Modal
    async function loadPredictions() {
      const select = document.getElementById('predictionDateSelect');
      const predictionsBody = document.getElementById('predictionsBody');
      try {
        predictionRows = await window.bangkagoDemand.getPredictions();
        const dates = [...new Set(predictionRows.map(function(p) {
          return p.predictionDate;
        }).filter(Boolean))].sort();

        if (dates.length === 0) {
          select.innerHTML = '';
          select.disabled = true;
          predictionsBody.innerHTML = '<p class="text-center text-muted mb-0">No predictions yet. Data will appear after the ML model publishes predictions.</p>';
          return;
        }

        select.disabled = false;
        select.innerHTML = dates.map(function(date) {
          return '<option value="' + date + '">' + formatPredictionDate(date) + '</option>';
        }).join('');
        select.value = dates[0];
        renderPredictionRows(select.value);
      } catch (e) {
        select.disabled = true;
        select.innerHTML = '';
        predictionsBody.innerHTML = '<p class="text-center text-danger mb-0">Failed to load predictions.</p>';
        console.error(e);
      }
    }

    document.getElementById('predictionDateSelect').addEventListener('change', function() {
      renderPredictionRows(this.value);
    });

    // Trends Modal
    async function loadTrends() {
      try {
        const summary = await window.bangkagoDemand.getRouteDemandSummary();
        const trendsContent = document.getElementById('trendsContent');
        var html = '';
        summary.forEach(function(r) {
          html += `
            <div class="col-md-6">
              <div class="panel-card p-3">
                <h6 class="mb-2">${r.routeName}</h6>
                <p class="mb-1"><strong>Avg Daily:</strong> ${formatNumber(r.avgDailyPredicted)} passengers</p>
                <p class="mb-1"><strong>Total:</strong> ${formatNumber(r.totalPredicted)} passengers</p>
                <p class="mb-0"><strong>Days with Data:</strong> ${formatNumber(r.daysWithData)}</p>
              </div>
            </div>
          `;
        });
        trendsContent.innerHTML = html || '<p class="text-muted">No predictions yet. Data will appear after the ML model publishes predictions.</p>';
      } catch (e) {
        console.error(e);
      }
    }

    // Insights Modal
    async function loadInsightRoutes() {
      try {
        const summary = await window.bangkagoDemand.getRouteDemandSummary();
        const select = document.getElementById('insightRoute');
        const output = document.getElementById('insightOutput');
        select.innerHTML = '<option value="">Select a route...</option>' +
          summary.map(function(r) {
            return '<option value="' + r.routeId + '">' + r.routeName + '</option>';
          }).join('');
        if (summary.length === 0) {
          output.className = 'alert alert-info mb-0';
          output.textContent = 'No predictions yet. Data will appear after the ML model publishes predictions.';
        } else {
          output.className = 'alert alert-info mb-0';
          output.textContent = 'Select a route and click Generate to produce recommendation.';
        }
      } catch (e) {
        console.error(e);
      }
    }

    document.getElementById('insightForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const routeId = document.getElementById('insightRoute').value;
      const output = document.getElementById('insightOutput');

      if (!routeId) {
        output.className = 'alert alert-warning mb-0';
        output.textContent = 'Please select a route.';
        return;
      }

      try {
        const summary = await window.bangkagoDemand.getRouteDemandSummary();
        const route = summary.find(r => r.routeId === routeId);

        let message = '';
        if (route) {
          if (route.totalPredicted > 100) {
            message = `High demand on ${route.routeName} (${formatNumber(route.totalPredicted)} predicted). ` +
              `Add extra trips and prioritize larger vessels.`;
          } else if (route.totalPredicted > 50) {
            message = `Moderate demand on ${route.routeName}. Maintain current schedule; ` +
              `consider a standby vessel during high-demand days.`;
          } else {
            message = `Low demand on ${route.routeName} (${formatNumber(route.totalPredicted)} predicted). ` +
              `Monitor weather and consider reducing frequency to optimize costs.`;
          }
        } else {
          message = 'No predictions yet. Data will appear after the ML model publishes predictions.';
        }

        output.className = 'alert alert-success mb-0';
        output.textContent = message;
      } catch (e) {
        output.className = 'alert alert-danger mb-0';
        output.textContent = 'Error generating insight: ' + e.message;
      }
    });

    window.bangkagoAuthReady.then(function(role) {
      if (role !== 'admin') return;

      window.bangkagoRealtime.subscribe('demand_predictions', null, function() {
        loadDemandData();
      });
      window.bangkagoRealtime.subscribe('bookings', null, function() {
        loadDemandData();
      });
      loadDemandData();
      loadPredictions();
    }).catch(function(e) {
      console.error('Failed to initialize demand page:', e);
      showError('Failed to initialize demand data: ' + e.message);
    });
  </script>
</body>
</html>
