<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo LGU/Coast Guard — View Active Alerts</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png" />

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/coastguard-theme.css"/>
</head>
<body data-page="alerts">
  <div class="cg-shell">
    <div id="sidebarMount"></div>
    <main class="cg-main" id="cgMain">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="row g-3">
          <!-- Main alerts table -->
          <div class="col-xl-9">
            <div class="cg-card">
              <div class="panel-head">
                <h6 class="mb-0">View Active Alerts (Read-Only)</h6>
                <span class="readonly-pill"><i class="bi bi-eye-fill"></i> Read Only</span>
              </div>

              <!-- Filters -->
              <div class="row g-2 mb-3 align-items-end filter-row">
                <div class="col-12 col-sm-6 col-lg-4">
                  <label class="form-label visually-hidden" for="alertSearchInput">Search</label>
                  <input id="alertSearchInput" class="form-control w-100" type="text" placeholder="Search alert, vessel, zone">
                </div>
                <div class="col-6 col-sm-6 col-lg-3">
                  <label class="form-label visually-hidden" for="severityFilter">Severity</label>
                  <select id="severityFilter" class="form-select w-100">
                    <option value="">All Severity</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                  </select>
                </div>
                <div class="col-6 col-sm-6 col-lg-3">
                  <label class="form-label visually-hidden" for="statusFilter">Status</label>
                  <select id="statusFilter" class="form-select w-100">
                    <option value="">All Status</option>
                    <option value="false">Open</option>
                    <option value="true">Resolved</option>
                  </select>
                </div>
                <div class="col-12 col-sm-6 col-lg-2 d-grid">
                  <button id="resetBtn" class="btn btn-outline-secondary w-100" type="button"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
                </div>
              </div>

              <div id="alertResultCount" class="small text-secondary mb-2"></div>

              <div class="table-responsive">
                <table class="table table-theme align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Alert ID</th>
                      <th>Message</th>
                      <th>Location</th>
                      <th>Time</th>
                      <th>Severity</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="alertsTableBody"></tbody>
                </table>
              </div>

              <p id="alertEmptyState" class="cg-empty d-none">
                No alerts matched your filters.
              </p>
            </div>
          </div>

          <!-- Side severity legend -->
          <div class="col-xl-3">
            <div class="cg-card h-100">
              <div class="panel-head">
                <h6 class="mb-0">Severity Legend</h6>
              </div>

              <div class="d-flex flex-column gap-2">
                <div class="d-flex align-items-center justify-content-between cg-legend-item">
                  <span><i class="bi bi-exclamation-octagon-fill text-danger me-2"></i>Critical</span>
                  <span class="badge text-bg-danger">Immediate Action</span>
                </div>

                <div class="d-flex align-items-center justify-content-between cg-legend-item">
                  <span><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>High</span>
                  <span class="badge text-bg-warning">Priority Watch</span>
                </div>

                <div class="d-flex align-items-center justify-content-between cg-legend-item">
                  <span><i class="bi bi-info-circle-fill text-info me-2"></i>Medium</span>
                  <span class="badge text-bg-info">Monitor</span>
                </div>

                <div class="d-flex align-items-center justify-content-between cg-legend-item">
                  <span><i class="bi bi-circle-fill text-secondary me-2"></i>Low</span>
                  <span class="badge text-bg-secondary">Info</span>
                </div>
              </div>

              <hr>
              <h6 class="mb-2">Status Meaning</h6>
              <div class="small text-secondary mb-2"><span class="badge text-bg-danger me-2">Open</span> Not yet resolved</div>
              <div class="small text-secondary mb-2"><span class="badge text-bg-success me-2">Resolved</span> Issue addressed</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../../assets/js/services/supabase.js"></script>
  <script src="../../../assets/js/services/alerts.js"></script>
  <script src="../../../assets/js/services/bangkas.js"></script>
  <script src="../../../assets/js/services/portsRoutes.js"></script>
  <script src="../../../assets/js/services/realtime.js"></script>

  <script>
    let alerts = [];

    const tbody = document.getElementById("alertsTableBody");
    const searchInput = document.getElementById("alertSearchInput");
    const severityFilter = document.getElementById("severityFilter");
    const statusFilter = document.getElementById("statusFilter");
    const resetBtn = document.getElementById("resetBtn");
    const countEl = document.getElementById("alertResultCount");
    const emptyEl = document.getElementById("alertEmptyState");

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        return new Date(dateStr).toLocaleString('en-PH', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function sevBadge(sev) {
      if (sev === 'critical') return "text-bg-danger";
      if (sev === 'high') return "text-bg-danger";
      if (sev === 'medium') return "text-bg-warning";
      return "text-bg-info";
    }

    function sevLabel(sev) {
      if (sev === 'low') return 'Info';
      return sev.charAt(0).toUpperCase() + sev.slice(1);
    }

    function statusBadge(resolved) {
      return resolved ? "text-bg-success" : "text-bg-danger";
    }

    function statusText(resolved) {
      return resolved ? 'Resolved' : 'Open';
    }

    function getLocation(alert) {
      if (alert.bangkaName) return 'Vessel: ' + alert.bangkaName;
      if (alert.portName) return 'Port: ' + alert.portName;
      return 'System-wide';
    }

    function renderRows(data) {
      tbody.innerHTML = "";

      if (data.length === 0) emptyEl.classList.remove("d-none");
      else emptyEl.classList.add("d-none");

      data.forEach(a => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${a.alertId.slice(0, 8)}...</td>
          <td>${a.message}</td>
          <td>${getLocation(a)}</td>
          <td>${formatDate(a.createdAt)}</td>
          <td><span class="badge ${sevBadge(a.severity)}">${sevLabel(a.severity)}</span></td>
          <td><span class="badge ${statusBadge(a.isResolved)}">${statusText(a.isResolved)}</span></td>
        `;
        tbody.appendChild(tr);
      });

      countEl.textContent = `Showing ${data.length} alert(s)`;
    }

    function runFilter() {
      const q = searchInput.value.trim().toLowerCase();
      const severity = severityFilter.value;
      const status = statusFilter.value;

      const filtered = alerts.filter(a => {
        const textMatch =
          a.alertId.toLowerCase().includes(q) ||
          a.message.toLowerCase().includes(q) ||
          (a.bangkaName || '').toLowerCase().includes(q) ||
          (a.portName || '').toLowerCase().includes(q);

        const sevMatch = severity ? a.severity === severity : true;
        const statusMatch = status ? String(a.isResolved) === status : true;
        return textMatch && sevMatch && statusMatch;
      });

      renderRows(filtered);
    }

    async function loadAlerts() {
      try {
        alerts = await window.bangkagoAlerts.listAll({ limit: 100 });
        renderRows(alerts);
      } catch (e) {
        console.error(e);
        emptyEl.textContent = 'Error loading alerts: ' + e.message;
        emptyEl.classList.remove("d-none");
      }
    }

    searchInput.addEventListener('input', runFilter);
    severityFilter.addEventListener('change', runFilter);
    statusFilter.addEventListener('change', runFilter);

    resetBtn.addEventListener('click', () => {
      searchInput.value = "";
      severityFilter.value = "";
      statusFilter.value = "";
      renderRows(alerts);
    });

    window.bangkagoAuthReady.then(function(role) {
      if (role !== 'coastguard') return;

      window.bangkagoRealtime.subscribe('safety_alerts', null, loadAlerts);
      loadAlerts();
    }).catch(function(e) {
      console.error('Failed to initialize Coast Guard alerts:', e);
      emptyEl.textContent = 'Failed to initialize alerts: ' + e.message;
      emptyEl.classList.remove('d-none');
    });
  </script>
</body>
</html>
