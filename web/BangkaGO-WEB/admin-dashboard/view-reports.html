<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BangkaGo Admin — Reports & Analytics</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin-theme.css"/>
  <style>
    .stat-card {
      border: 1px solid var(--gray-200);
      border-radius: 16px;
      padding: 1.25rem;
      background: #fff;
      box-shadow: 0 2px 10px rgba(16,24,40,.04);
      height: 100%;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(16,24,40,.08); }
    .stat-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .stat-value { font-size: 2.25rem; font-weight: 800; line-height: 1.1; }
    .stat-label { color: var(--gray-500); font-size: 0.875rem; text-align: center; margin-top: 0.5rem; }
    .stat-trend { font-size: 0.8rem; margin-top: 0.5rem; font-weight: 600; }
    .trend-up { color: var(--success); }
    .trend-down { color: var(--danger); }
    .trend-neutral { color: var(--gray-500); }
  </style>
</head>
<body data-page="view-reports">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Reports & Analytics</h6>
            <span class="muted-note">System-wide metrics and performance overview</span>
          </div>

          <!-- Stat Cards Grid -->
          <div class="row g-3 mb-4" id="statsGrid">
            <!-- Stats loaded dynamically -->
          </div>

          <!-- Additional Details -->
          <div class="row g-3">
            <div class="col-lg-6">
              <div class="cg-card">
                <div class="panel-head">
                  <h6 class="mb-0">Revenue Breakdown</h6>
                </div>
                <div class="table-responsive">
                  <table class="table table-theme align-middle mb-0">
                    <thead>
                      <tr><th>Period</th><th>Revenue</th><th>Trips</th><th>Avg/Trip</th></tr>
                    </thead>
                    <tbody id="revenueBreakdown"></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="col-lg-6">
              <div class="cg-card">
                <div class="panel-head">
                  <h6 class="mb-0">User Growth</h6>
                </div>
                <div class="table-responsive">
                  <table class="table table-theme align-middle mb-0">
                    <thead>
                      <tr><th>Period</th><th>New Users</th><th>Total Users</th><th>Growth</th></tr>
                    </thead>
                    <tbody id="userGrowth"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

          <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2 text-muted">Loading reports...</p>
          </div>
          
          <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../assets/js/services/supabase.js"></script>
  <script src="../../assets/js/services/stats.js"></script>
  <script src="../../assets/js/services/bookings.js"></script>
  <script src="../../assets/js/services/realtime.js"></script>

  <script>
    const statsGrid = document.getElementById('statsGrid');
    const revenueBreakdown = document.getElementById('revenueBreakdown');
    const userGrowth = document.getElementById('userGrowth');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    function peso(n) {
      return '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
    }

    function formatNumber(n) {
      return Number(n).toLocaleString('en-PH');
    }

    function trendClass(current, previous) {
      if (!previous || previous === 0) return 'trend-neutral';
      return current > previous ? 'trend-up' : (current < previous ? 'trend-down' : 'trend-neutral');
    }

    function trendText(current, previous) {
      if (!previous || previous === 0) return '—';
      var pct = ((current - previous) / previous * 100).toFixed(1);
      return (current >= previous ? '+' : '') + pct + '%';
    }

    function showLoading(show) {
      loadingState.classList.toggle('d-none', !show);
      errorState.classList.add('d-none');
    }

    function showError(msg) {
      loadingState.classList.add('d-none');
      errorState.textContent = msg;
      errorState.classList.remove('d-none');
    }

    function renderStats(s) {
      if (!s) return;

      var today = new Date();
      var yesterday = new Date(today.getTime() - 86400000);
      var yesterdayStr = yesterday.toISOString().slice(0, 10);
      var todayStr = today.toISOString().slice(0, 10);

      var statCards = [
        {
          label: 'Total Users',
          value: formatNumber(s.totalUsers),
          icon: '<i class="bi bi-people-fill" aria-hidden="true"></i>',
          color: 'var(--primary)',
          trend: null
        },
        {
          label: 'Active Bangkeros',
          value: formatNumber(s.activeBangkeros),
          icon: '<i class="bi bi-water" aria-hidden="true"></i>',
          color: 'var(--warning)',
          trend: null
        },
        {
          label: 'Total Trips',
          value: formatNumber(s.totalTrips),
          icon: '<i class="bi bi-clipboard-data" aria-hidden="true"></i>',
          color: 'var(--accent)',
          trend: null
        },
        {
          label: 'Total Revenue',
          value: peso(s.totalRevenue),
          icon: '<i class="bi bi-cash-coin" aria-hidden="true"></i>',
          color: 'var(--primary)',
          trend: null
        },
        {
          label: 'Trips Today',
          value: formatNumber(s.tripsToday),
          icon: '<i class="bi bi-calendar-day" aria-hidden="true"></i>',
          color: 'var(--primary)',
          trend: { current: s.tripsToday, previous: 0, label: 'vs yesterday' }
        },
        {
          label: 'Revenue Today',
          value: peso(s.revenueToday),
          icon: '<i class="bi bi-wallet2" aria-hidden="true"></i>',
          color: 'var(--warning)',
          trend: { current: s.revenueToday, previous: 0, label: 'vs yesterday' }
        },
        {
          label: 'New Users (7d)',
          value: formatNumber(s.newUsersThisWeek),
          icon: '<i class="bi bi-graph-up-arrow" aria-hidden="true"></i>',
          color: 'var(--accent)',
          trend: null
        },
        {
          label: 'Completed Today',
          value: formatNumber(s.completedTripsToday),
          icon: '<i class="bi bi-check-circle-fill" aria-hidden="true"></i>',
          color: 'var(--primary)',
          trend: { current: s.completedTripsToday, previous: 0, label: 'vs yesterday' }
        },
        {
          label: 'Pending Approvals',
          value: formatNumber(s.pendingApprovals),
          icon: '<i class="bi bi-hourglass-split" aria-hidden="true"></i>',
          color: 'var(--warning)',
          trend: null
        },
        {
          label: 'Active Alerts',
          value: formatNumber(s.activeAlerts),
          icon: '<i class="bi bi-bell-fill" aria-hidden="true"></i>',
          color: s.activeAlerts > 0 ? 'var(--danger)' : 'var(--gray-500)',
          trend: null
        }
      ];

      statsGrid.innerHTML = statCards.map(function(card) {
        var trendHtml = '';
        if (card.trend) {
          var tc = trendClass(card.trend.current, card.trend.previous);
          trendHtml = '<div class="stat-trend ' + tc + '">' + trendText(card.trend.current, card.trend.previous) + ' ' + card.trend.label + '</div>';
        }
        return `
          <div class="col-xl-2 col-md-4 col-6">
            <div class="stat-card" style="border-left: 4px solid ` + card.color + `;">
              <div class="stat-icon" style="color: ` + card.color + `;">` + card.icon + `</div>
              <div class="stat-value" style="color: ` + card.color + `;">` + card.value + `</div>
              <div class="stat-label">` + card.label + `</div>
              ` + trendHtml + `
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRevenueBreakdown(s) {
      // Since we don't have historical breakdown in stats, show what we have
      revenueBreakdown.innerHTML = `
        <tr>
          <td>Today</td>
          <td>` + peso(s.revenueToday) + `</td>
          <td>` + formatNumber(s.completedTripsToday) + `</td>
          <td>` + (s.completedTripsToday > 0 ? peso(s.revenueToday / s.completedTripsToday) : '—') + `</td>
        </tr>
        <tr>
          <td>All Time (Completed)</td>
          <td>` + peso(s.totalRevenue) + `</td>
          <td>` + formatNumber(s.totalTrips) + `</td>
          <td>` + (s.totalTrips > 0 ? peso(s.totalRevenue / s.totalTrips) : '—') + `</td>
        </tr>
      `;
    }

    function renderUserGrowth(s) {
      userGrowth.innerHTML = `
        <tr>
          <td>This Week</td>
          <td>` + formatNumber(s.newUsersThisWeek) + `</td>
          <td>` + formatNumber(s.totalUsers) + `</td>
          <td class="trend-up">+` + ((s.newUsersThisWeek / (s.totalUsers - s.newUsersThisWeek) * 100) || 0).toFixed(1) + `%</td>
        </tr>
        <tr>
          <td>Total</td>
          <td>—</td>
          <td>` + formatNumber(s.totalUsers) + `</td>
          <td>—</td>
        </tr>
      `;
    }

    async function loadReports() {
      showLoading(true);
      try {
        var stats = await window.bangkagoStats.getAdminStats();
        renderStats(stats);
        renderRevenueBreakdown(stats);
        renderUserGrowth(stats);
      } catch (e) {
        console.error(e);
        showError('Failed to load reports: ' + e.message);
      }
    }

    window.bangkagoAuthReady.then(function(role) {
      if (role !== 'admin') return;

      window.bangkagoRealtime.subscribe('users', null, function() {
        loadReports();
      });
      window.bangkagoRealtime.subscribe('bangkeros', null, function() {
        loadReports();
      });
      window.bangkagoRealtime.subscribe('bookings', null, function() {
        loadReports();
      });
      window.bangkagoRealtime.subscribe('safety_alerts', null, function() {
        loadReports();
      });

      loadReports();
      setInterval(loadReports, 30000);
    }).catch(function(e) {
      console.error('Failed to initialize reports page:', e);
      showError('Failed to initialize reports: ' + e.message);
    });
  </script>
</body>
</html>
