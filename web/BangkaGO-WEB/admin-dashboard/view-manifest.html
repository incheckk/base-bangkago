<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BangkaGo Admin — View Manifests</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-theme.css"/>
  <script>
    (function () {
      try {
        var role = sessionStorage.getItem("bangkago_role");
        if (role !== "admin") throw new Error("unauthorized");
      } catch (e) {
        location.replace("../../bangkaGo-access.html");
      }
    })();
  </script>
</head>
<body data-page="view-manifests">
<div class="cg-shell"><div id="sidebarMount"></div><main class="cg-main"><div id="topbarMount"></div>
<section class="cg-content container-fluid">
  <div class="cg-card p-3">
    <div class="panel-head"><h6 class="mb-0">View Manifests</h6><span class="muted-note">Search manifest, view passenger list, export manifest</span></div>
    <div class="row g-2 mb-3">
      <div class="col-md-4"><input id="manifestSearch" class="form-control" placeholder="Search manifest ID or vessel"></div>
      <div class="col-md-2 d-grid"><button id="manifestReset" class="btn btn-outline-secondary">Reset</button></div>
    </div>
    <div class="table-responsive">
      <table class="table table-theme align-middle mb-0">
        <thead><tr><th>Manifest ID</th><th>Vessel</th><th>Route</th><th>Date</th><th>Passengers</th><th>Actions</th></tr></thead>
        <tbody id="manifestBody"></tbody>
      </table>
    </div>
  </div>
</section>
</main></div>

<div class="modal fade" id="manifestModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="manifestTitle">Manifest</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="manifestContent"></div>
</div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>`n  <script src="assets/js/admin-theme.js"></script>
  <script src="assets/js/layout-loader.js"></script>
<script>
const manifests=[
  {id:'MN-201',vessel:'Boat 03',route:'Mactan Port → Olango',date:'2026-04-20',passengers:['Amploy A. Cruz','Buddy B. Lim','Christian C. Tan']},
  {id:'MN-202',vessel:'Boat 08',route:'Marigondon Port → Olango',date:'2026-04-21',passengers:['D. Reyes','E. Lopez']},
  {id:'MN-203',vessel:'Boat 15',route:'Olango Port → Caohagan',date:'2026-04-22',passengers:['F. Dela Cruz','G. Yap','H. Co']}
];
const body=document.getElementById('manifestBody'); const modal=new bootstrap.Modal('#manifestModal');
function render(data){body.innerHTML=''; data.forEach((m,i)=>body.innerHTML+=`<tr><td>${m.id}</td><td>${m.vessel}</td><td>${m.route}</td><td>${m.date}</td><td>${m.passengers.length}</td><td><div class="d-flex gap-2"><button class="btn btn-sm btn-outline-primary action-btn" onclick="viewPassengers(${i})">Passenger List</button><button class="btn btn-sm btn-outline-dark action-btn" onclick="exportManifest(${i})">Export</button></div></td></tr>`)}
window.viewPassengers=i=>{const m=manifests[i];document.getElementById('manifestTitle').textContent='View Passenger List';document.getElementById('manifestContent').innerHTML=`<p><strong>${m.id}</strong> - ${m.vessel}</p><ul class="list-group">${m.passengers.map(p=>`<li class="list-group-item">${p}</li>`).join('')}</ul>`;modal.show();}
window.exportManifest=i=>{const m=manifests[i];document.getElementById('manifestTitle').textContent='Export Manifest';document.getElementById('manifestContent').innerHTML=`<div class="alert alert-success mb-0">Manifest <strong>${m.id}</strong> exported successfully.</div>`;modal.show();}
document.getElementById('manifestSearch').addEventListener('input',()=>{const q=manifestSearch.value.toLowerCase().trim();render(manifests.filter(m=>m.id.toLowerCase().includes(q)||m.vessel.toLowerCase().includes(q)));});
document.getElementById('manifestReset').addEventListener('click',()=>{manifestSearch.value='';render(manifests);});
render(manifests);
</script>
</body>
</html>
