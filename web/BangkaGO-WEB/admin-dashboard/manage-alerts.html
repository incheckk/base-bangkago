<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BangkaGo Admin — Manage Alerts</title>

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin-theme.css"/>
  <style>
    .summary-box{border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50);padding:.7rem .85rem;}
  </style>
</head>
<body data-page="manage-alerts">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Manage Alerts</h6>
            <span class="muted-note">Create alerts, resolve issues, and send notifications</span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-3 d-grid">
              <button class="btn btn-bangkago" id="openCreateAlertBtn">
                <i class="bi bi-plus-circle me-1"></i> Create Alert
              </button>
            </div>
            <div class="col-md-4">
              <input id="alertSearch" class="form-control" placeholder="Search ID, message, or location">
            </div>
            <div class="col-md-2">
              <select id="levelFilter" class="form-select">
                <option value="">All Levels</option>
                <option value="critical">Critical</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
              </select>
            </div>
            <div class="col-md-2">
              <select id="statusFilter" class="form-select">
                <option value="">All Status</option>
                <option value="false">Open</option>
                <option value="true">Resolved</option>
              </select>
            </div>
            <div class="col-md-1 d-grid">
              <button id="alertReset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Message</th>
                  <th>Level</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Created</th>
                  <th style="width:280px;">Actions</th>
                </tr>
              </thead>
              <tbody id="alertBody"></tbody>
            </table>
          </div>
          
          <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2 text-muted">Loading alerts...</p>
          </div>
          
          <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- CREATE ALERT MODAL -->
  <div class="modal fade" id="createAlertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="createAlertForm">
        <div class="modal-header">
          <h5 class="modal-title">Create Alert</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Alert Message</label>
            <textarea id="alertMsg" class="form-control" rows="3" placeholder="Describe the alert..." required></textarea>
          </div>
          <div class="mb-2">
            <label class="form-label">Severity</label>
            <select id="alertSeverity" class="form-select" required>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="critical">Critical</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Related Vessel (optional)</label>
            <select id="alertBangka" class="form-select">
              <option value="">None</option>
            </select>
          </div>
          <div class="mb-0">
            <label class="form-label">Related Port (optional)</label>
            <select id="alertPort" class="form-select">
              <option value="">None</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-bangkago">Create Alert</button>
        </div>
      </form>
    </div>
  </div>

  <!-- UPDATE/RESOLVE ALERT MODAL -->
  <div class="modal fade" id="updateAlertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="updateAlertForm">
        <div class="modal-header">
          <h5 class="modal-title">Update Alert Status</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="summary-box mb-3">
            <div><strong>Alert ID:</strong> <span id="uId">-</span></div>
            <div><strong>Message:</strong> <span id="uMessage">-</span></div>
            <div><strong>Level:</strong> <span id="uLevel">-</span></div>
            <div><strong>Location:</strong> <span id="uLocation">-</span></div>
            <div><strong>Created:</strong> <span id="uCreated">-</span></div>
          </div>

          <div class="mb-2">
            <label class="form-label">Status</label>
            <select id="uStatus" class="form-select">
              <option value="false">Open</option>
              <option value="true">Resolved</option>
            </select>
          </div>

          <div class="mb-0">
            <label class="form-label">Resolution Notes</label>
            <textarea id="uNotes" class="form-control" rows="3" placeholder="Optional notes..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-dark">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SEND NOTIFICATION MODAL -->
  <div class="modal fade" id="notifyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="notifyForm">
        <div class="modal-header">
          <h5 class="modal-title">Send Notification</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="summary-box mb-3">
            <div><strong>Alert ID:</strong> <span id="nId">-</span></div>
            <div><strong>Message:</strong> <span id="nMessagePreview">-</span></div>
          </div>

          <div class="mb-2">
            <label class="form-label">Recipients</label>
            <select id="nRecipients" class="form-select">
              <option value="all_operators">All Operators (Bangkeros)</option>
              <option value="coastguard">Coast Guard</option>
              <option value="admins">Admins Only</option>
              <option value="all">All Users</option>
            </select>
          </div>

          <div class="mb-0">
            <label class="form-label">Notification Message</label>
            <textarea id="nMessage" class="form-control" rows="3" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-primary">Send</button>
        </div>
      </form>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div class="modal fade" id="resultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Action Completed</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="resultBox"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../assets/js/services/supabase.js"></script>
  <script src="../../assets/js/services/alerts.js"></script>
  <script src="../../assets/js/services/bangkas.js"></script>
  <script src="../../assets/js/services/portsRoutes.js"></script>
  <script src="../../assets/js/services/realtime.js"></script>

  <script>
    let alerts = [];
    let selectedIndex = null;

    const body = document.getElementById('alertBody');
    const alertSearch = document.getElementById('alertSearch');
    const levelFilter = document.getElementById('levelFilter');
    const statusFilter = document.getElementById('statusFilter');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    const createAlertModal = new bootstrap.Modal(document.getElementById('createAlertModal'));
    const updateAlertModal = new bootstrap.Modal(document.getElementById('updateAlertModal'));
    const notifyModal = new bootstrap.Modal(document.getElementById('notifyModal'));
    const resultModal = new bootstrap.Modal(document.getElementById('resultModal'));

    function lvlBadge(level) {
      if (level === 'critical') return 'text-bg-danger';
      if (level === 'high') return 'text-bg-danger';
      if (level === 'medium') return 'text-bg-warning';
      return 'text-bg-info';
    }

    function lvlText(level) {
      if (level === 'low') return 'Info';
      return level.charAt(0).toUpperCase() + level.slice(1);
    }

    function stBadge(resolved) {
      return resolved ? 'text-bg-success' : 'text-bg-warning';
    }

    function stText(resolved) {
      return resolved ? 'Resolved' : 'Open';
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        return new Date(dateStr).toLocaleString('en-PH', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function getLocation(alert) {
      if (alert.bangkaName) return 'Vessel: ' + alert.bangkaName;
      if (alert.portName) return 'Port: ' + alert.portName;
      return 'General';
    }

    function showLoading(show) {
      loadingState.classList.toggle('d-none', !show);
      errorState.classList.add('d-none');
    }

    function showError(msg) {
      loadingState.classList.add('d-none');
      errorState.textContent = msg;
      errorState.classList.remove('d-none');
    }

    function render(data) {
      body.innerHTML = data.map((alert) => `
          <tr>
            <td>${alert.alertId.slice(0, 8)}...</td>
            <td>${alert.message}</td>
            <td><span class="badge ${lvlBadge(alert.severity)}">${lvlText(alert.severity)}</span></td>
            <td>${getLocation(alert)}</td>
            <td><span class="badge ${stBadge(alert.isResolved)}">${stText(alert.isResolved)}</span></td>
            <td>${formatDate(alert.createdAt)}</td>
            <td>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-dark action-btn" onclick="openUpdateAlert('${alert.alertId}')">
                  <i class="bi bi-check2-square"></i> ${alert.isResolved ? 'Reopen' : 'Resolve'}
                </button>
                <button class="btn btn-sm btn-outline-primary action-btn" onclick="openNotify('${alert.alertId}')">
                  <i class="bi bi-bell"></i> Notify
                </button>
              </div>
            </td>
          </tr>
      `).join('');
    }

    function runFilter() {
      const q = alertSearch.value.toLowerCase().trim();
      const l = levelFilter.value;
      const s = statusFilter.value;

      const filtered = alerts.filter(a => {
        const textMatch =
          a.alertId.toLowerCase().includes(q) ||
          a.message.toLowerCase().includes(q) ||
          (a.bangkaName || '').toLowerCase().includes(q) ||
          (a.portName || '').toLowerCase().includes(q);

        const levelMatch = l ? a.severity === l : true;
        const statusMatch = s ? String(a.isResolved) === s : true;
        return textMatch && levelMatch && statusMatch;
      });

      render(filtered);
    }

    // Open create modal
    document.getElementById('openCreateAlertBtn').addEventListener('click', () => {
      createAlertModal.show();
    });

    // Create alert submit
    document.getElementById('createAlertForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const message = document.getElementById('alertMsg').value.trim();
      const severity = document.getElementById('alertSeverity').value;
      const bangkaId = document.getElementById('alertBangka').value || null;
      const portId = document.getElementById('alertPort').value || null;

      if (!message) {
        alert('Please enter an alert message.');
        return;
      }

      try {
        await window.bangkagoAlerts.create({ message, severity, bangkaId, portId });
        createAlertModal.hide();
        e.target.reset();
        await loadAlerts();
        alert("Alert created successfully.");
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });

    // Open update/resolve modal. Looked up by id: the table renders the
    // FILTERED list, so a row index would hit a different alert otherwise.
    window.openUpdateAlert = function(alertId) {
      selectedIndex = alerts.findIndex(a => a.alertId === alertId);
      if (selectedIndex === -1) return;
      const a = alerts[selectedIndex];

      document.getElementById('uId').textContent = a.alertId;
      document.getElementById('uMessage').textContent = a.message;
      document.getElementById('uLevel').textContent = lvlText(a.severity);
      document.getElementById('uLocation').textContent = getLocation(a);
      document.getElementById('uCreated').textContent = formatDate(a.createdAt);
      document.getElementById('uStatus').value = a.isResolved ? 'true' : 'false';
      document.getElementById('uNotes').value = '';

      updateAlertModal.show();
    }

    // Save update/resolve
    document.getElementById('updateAlertForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (selectedIndex === null) return;

      const a = alerts[selectedIndex];
      const newStatus = document.getElementById('uStatus').value === 'true';
      const notes = document.getElementById('uNotes').value.trim();

      try {
        await window.bangkagoAlerts.resolve(a.alertId, notes);
        a.isResolved = newStatus;
        runFilter();
        updateAlertModal.hide();

        document.getElementById('resultBox').innerHTML = `
          <div class="alert alert-success mb-0">
            Alert <strong>${a.alertId.slice(0, 8)}...</strong> marked as <strong>${stText(newStatus)}</strong>.
          </div>
        `;
        resultModal.show();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });

    // Open notify modal (by id — same filtered-list caveat as above)
    window.openNotify = function(alertId) {
      selectedIndex = alerts.findIndex(a => a.alertId === alertId);
      if (selectedIndex === -1) return;
      const a = alerts[selectedIndex];

      document.getElementById('nId').textContent = a.alertId;
      document.getElementById('nMessagePreview').textContent = a.message.length > 50 ? a.message.slice(0, 50) + '...' : a.message;
      document.getElementById('nRecipients').value = 'all_operators';
      document.getElementById('nMessage').value = '[' + lvlText(a.severity) + '] ' + a.message;

      notifyModal.show();
    }

    // Send notification
    document.getElementById('notifyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (selectedIndex === null) return;

      const a = alerts[selectedIndex];
      const recipients = document.getElementById('nRecipients').value;
      const message = document.getElementById('nMessage').value.trim();

      if (!message) {
        alert('Please enter a notification message.');
        return;
      }

      try {
        const result = await window.bangkagoAlerts.notify(a.alertId, recipients, message);
        notifyModal.hide();

        document.getElementById('resultBox').innerHTML = `
          <div class="alert alert-success mb-2">
            Notification sent to <strong>${result.count}</strong> recipient(s).
          </div>
          <div class="summary-box">
            <div><strong>Alert:</strong> ${a.alertId.slice(0, 8)}... - ${a.message.slice(0, 50)}...</div>
            <div><strong>Recipients:</strong> ${recipients.replace('_', ' ')}</div>
          </div>
        `;
        resultModal.show();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });

    // Populate bangka and port dropdowns
    async function populateDropdowns() {
      try {
        const [bangkas, ports] = await Promise.all([
          window.bangkagoBangkas.listAll({}),
          window.bangkagoPortsRoutes.listPorts(true)
        ]);

        const bangkaSelect = document.getElementById('alertBangka');
        bangkas.forEach(b => {
          if (b.bangkeroVerification === 'verified') {
            const opt = document.createElement('option');
            opt.value = b.bangkaId;
            opt.textContent = b.bangkaName + ' (' + (b.bangkeroName || 'Unassigned') + ')';
            bangkaSelect.appendChild(opt);
          }
        });

        const portSelect = document.getElementById('alertPort');
        ports.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.portId;
          opt.textContent = p.portName;
          portSelect.appendChild(opt);
        });
      } catch (e) {
        console.error('Failed to load dropdowns:', e);
      }
    }

    async function loadAlerts() {
      showLoading(true);
      try {
        alerts = await window.bangkagoAlerts.listAll({ limit: 100 });
        render(alerts);
        showLoading(false);
      } catch (e) {
        console.error(e);
        showError('Failed to load alerts: ' + e.message);
      }
    }

    // Filters
    alertSearch.addEventListener('input', runFilter);
    levelFilter.addEventListener('change', runFilter);
    statusFilter.addEventListener('change', runFilter);

    document.getElementById('alertReset').addEventListener('click', () => {
      alertSearch.value = '';
      levelFilter.value = '';
      statusFilter.value = '';
      render(alerts);
    });

    window.bangkagoAuthReady.then(function(role) {
      if (role !== 'admin') return;

      window.bangkagoRealtime.subscribe('safety_alerts', null, function() {
        loadAlerts();
      });
      populateDropdowns();
      loadAlerts();
    }).catch(function(e) {
      console.error('Failed to initialize alerts page:', e);
      showError('Failed to initialize alerts: ' + e.message);
    });
  </script>
</body>
</html>
