<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Admin — Report Compliance Issue</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-theme.css"/>
  <script>
    (function () {
      try {
        var role = sessionStorage.getItem("bangkago_role");
        if (role !== "admin") throw new Error("unauthorized");
      } catch (e) {
        location.replace("../../bangkaGo-access.html");
      }
    })();
  </script>

  <style>
    .panel-card{
      border:1px solid #d8dee8;
      border-radius:16px;
      background:#fff;
      box-shadow:0 2px 10px rgba(16,24,40,.04);
    }
    .summary-box{
      border:1px solid #e5e7eb;
      border-radius:10px;
      background:#f8fafc;
      padding:.75rem .85rem;
    }

    /* Trigger button — unified pill style */
    .report-trigger-btn{
      appearance:none;
      -webkit-appearance:none;
      border:1.5px solid var(--blue-600) !important;
      background:var(--blue-600) !important;
      color:#fff !important;
      border-radius:999px !important;
      min-height:42px;
      padding:.55rem 1.25rem;
      display:inline-flex !important;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      font-weight:600;
      font-family:var(--font-display);
      line-height:1;
      text-decoration:none !important;
      cursor:pointer;
      box-shadow:0 4px 14px rgba(21,101,192,.2);
      transition: all var(--ease-fast);
    }
    .report-trigger-btn:hover{
      background:var(--blue-800) !important;
      border-color:var(--blue-800) !important;
      color:#fff !important;
      transform:translateY(-1px);
      box-shadow:0 8px 20px rgba(21,101,192,.25);
    }
    .report-trigger-btn:focus{
      outline:none;
      box-shadow:0 0 0 3px rgba(21,101,192,.2);
    }
    .report-trigger-btn i,
    .report-trigger-btn span{ color:#fff !important; }

    #submitReportForm .modal-footer{
      display:flex;
      justify-content:flex-end;
      gap:.5rem;
      flex-wrap:wrap;
    }
    #submitReportForm .modal-footer .btn{
      display:inline-flex !important;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      min-height:42px;
      text-decoration:none !important;
      font-weight:600;
      padding:.625rem 1.25rem;
    }
  </style>
</head>
<body data-page="report-compliance-issue">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3 mb-3">
          <div class="panel-head">
            <h6 class="mb-0">Report Compliance Issue</h6>
            <span class="muted-note">Submit incidents with optional evidence in one workflow</span>
          </div>

          <div class="d-flex flex-wrap gap-2 mb-3">
            <button type="button" id="btnSubmitReport" class="report-trigger-btn">
              <i class="bi bi-send-check"></i>
              <span>Submit Report</span>
            </button>
          </div>

          <div class="panel-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h5 class="mb-0">Compliance Reports</h5>
              <span class="badge text-bg-info">Admin • LGU • Coast Guard</span>
            </div>
            <div class="table-responsive">
              <table class="table table-theme align-middle mb-0">
                <thead>
                  <tr>
                    <th>Report ID</th>
                    <th>Filed By</th>
                    <th>Category</th>
                    <th>Subject</th>
                    <th>Evidence</th>
                    <th>Status</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="complianceBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- SUBMIT REPORT (WITH EVIDENCE) MODAL -->
  <div class="modal fade" id="submitReportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <form class="modal-content" id="submitReportForm">
        <div class="modal-header">
          <h5 class="modal-title">Submit Compliance Report</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="summary-box mb-3">
            <div><strong>Tip:</strong> Attach evidence now (optional) to avoid follow-up delays.</div>
          </div>

          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Filed By</label>
              <input id="filedBy" class="form-control" placeholder="e.g. Coast Guard Unit 3" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Category</label>
              <select id="issueCategory" class="form-select" required>
                <option value="Safety">Safety</option>
                <option value="Documentation">Documentation</option>
                <option value="Operations">Operations</option>
                <option value="Payments">Payments</option>
              </select>
            </div>

            <div class="col-md-12">
              <label class="form-label">Subject</label>
              <input id="issueSubject" class="form-control" placeholder="Short issue title" required>
            </div>

            <div class="col-md-12">
              <label class="form-label">Details</label>
              <textarea id="issueDetails" class="form-control" rows="3" placeholder="Describe the compliance issue..." required></textarea>
            </div>

            <div class="col-md-4">
              <label class="form-label">Evidence Type</label>
              <select id="evidenceType" class="form-select">
                <option value="">None</option>
                <option value="Photo">Photo</option>
                <option value="Video">Video</option>
                <option value="Document">Document</option>
              </select>
            </div>

            <div class="col-md-8">
              <label class="form-label">Upload File (optional)</label>
              <input type="file" class="form-control" id="evidenceFile">
            </div>

            <div class="col-md-12">
              <label class="form-label">Evidence Remarks (optional)</label>
              <textarea id="evidenceRemarks" class="form-control" rows="2" placeholder="Add context for the attachment..."></textarea>
            </div>
          </div>
        </div>

        <div class="modal-footer d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-outline-secondary btn-lg" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary btn-lg fw-semibold px-4">
            <i class="bi bi-send-check me-2"></i>Submit Report
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div class="modal fade" id="resultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Submission Complete</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="resultBox"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin-theme.js"></script>
  <script src="assets/js/layout-loader.js"></script>

  <script>
    const reports = [
      {id:'CI-001',by:'Admin',cat:'Safety',subject:'Missing life jackets on Boat 15',evidence:'Photo',status:'Open',date:'2026-04-16'},
      {id:'CI-002',by:'LGU Batangas',cat:'Documentation',subject:'Expired operator license',evidence:'Document',status:'Under Review',date:'2026-04-16'}
    ];

    const tbody = document.getElementById('complianceBody');
    const submitModal = new bootstrap.Modal('#submitReportModal');
    const resultModal = new bootstrap.Modal('#resultModal');

    document.getElementById('btnSubmitReport').addEventListener('click', () => submitModal.show());

    function statusBadge(status){
      if(status === 'Resolved') return 'text-bg-success';
      if(status === 'Under Review') return 'text-bg-warning';
      return 'text-bg-danger';
    }

    function evidenceBadge(ev){
      if(!ev || ev === 'None') return '<span class="badge text-bg-secondary">None</span>';
      if(ev === 'Photo') return '<span class="badge text-bg-info">Photo</span>';
      if(ev === 'Video') return '<span class="badge text-bg-primary">Video</span>';
      return '<span class="badge text-bg-dark">Document</span>';
    }

    function renderTable(){
      tbody.innerHTML = '';
      reports.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>${r.id}</td>
            <td>${r.by}</td>
            <td>${r.cat}</td>
            <td>${r.subject}</td>
            <td>${evidenceBadge(r.evidence)}</td>
            <td><span class="badge ${statusBadge(r.status)}">${r.status}</span></td>
            <td>${r.date}</td>
          </tr>
        `;
      });
    }

    document.getElementById('submitReportForm').addEventListener('submit', function(e){
      e.preventDefault();

      const nextId = `CI-${String(reports.length + 1).padStart(3,'0')}`;
      const today = new Date().toISOString().slice(0,10);

      const by = document.getElementById('filedBy').value.trim();
      const cat = document.getElementById('issueCategory').value;
      const subject = document.getElementById('issueSubject').value.trim();
      const details = document.getElementById('issueDetails').value.trim();

      const evidenceType = document.getElementById('evidenceType').value || 'None';
      const fileInput = document.getElementById('evidenceFile');
      const fileName = fileInput.files[0] ? fileInput.files[0].name : '';
      const evidenceRemarks = document.getElementById('evidenceRemarks').value.trim();

      reports.unshift({
        id: nextId,
        by,
        cat,
        subject,
        evidence: evidenceType,
        status: 'Open',
        date: today
      });

      renderTable();
      submitModal.hide();

      document.getElementById('resultBox').innerHTML = `
        <div class="alert alert-success mb-2">
          Report <strong>${nextId}</strong> submitted successfully.
        </div>
        <div class="summary-box mb-2"><strong>Filed By:</strong> ${by}</div>
        <div class="summary-box mb-2"><strong>Category:</strong> ${cat}</div>
        <div class="summary-box mb-2"><strong>Subject:</strong> ${subject}</div>
        <div class="summary-box mb-2"><strong>Details:</strong> ${details}</div>
        <div class="summary-box mb-2"><strong>Evidence Type:</strong> ${evidenceType}</div>
        <div class="summary-box mb-2"><strong>File:</strong> ${fileName || '-'}</div>
        <div class="summary-box mb-0"><strong>Evidence Remarks:</strong> ${evidenceRemarks || '-'}</div>
      `;
      resultModal.show();

      e.target.reset();
    });

    renderTable();
  </script>
</body>
</html>
