<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo LGU/Coast Guard — View Bangkeros</title>

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/coastguard-theme.css"/>
</head>
<body data-page="view-bangkeros">
  <div class="cg-shell">
    <div id="sidebarMount"></div>
    <main class="cg-main" id="cgMain">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="row g-3">
          <div class="col-12">
            <div class="cg-card">
              <div class="panel-head">
                <h6 class="mb-0">View Bangkero List (Read-Only)</h6>
                <span class="readonly-pill"><i class="bi bi-eye-fill"></i> Read Only</span>
              </div>

              <!-- Filters -->
              <div class="row g-2 mb-3 align-items-end filter-row">
                <div class="col-12 col-sm-6 col-lg-4">
                  <label class="form-label visually-hidden" for="bangkeroSearchInput">Search</label>
                  <input id="bangkeroSearchInput" class="form-control w-100" type="text" placeholder="Search name, license, contact">
                </div>
                <div class="col-6 col-sm-6 col-lg-3">
                  <label class="form-label visually-hidden" for="statusFilter">Status</label>
                  <select id="statusFilter" class="form-select w-100">
                    <option value="">All Status</option>
                    <option value="On Duty">On Duty</option>
                    <option value="Active">Active</option>
                    <option value="Suspended">Suspended</option>
                  </select>
                </div>
                <div class="col-6 col-sm-6 col-lg-3">
                  <label class="form-label visually-hidden" for="verificationFilter">Verification</label>
                  <select id="verificationFilter" class="form-select w-100">
                    <option value="">All</option>
                    <option value="verified">Verified</option>
                    <option value="pending">Pending</option>
                    <option value="rejected">Rejected</option>
                  </select>
                </div>
                <div class="col-12 col-sm-6 col-lg-2 d-grid">
                  <button id="resetBtn" class="btn btn-outline-secondary w-100" type="button"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
                </div>
              </div>

              <div id="resultCount" class="small text-secondary mb-2"></div>

              <!-- Table -->
              <div class="table-responsive">
                <table class="table table-theme align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Bangkero ID</th>
                      <th>Full Name</th>
                      <th>License No.</th>
                      <th>Assigned Vessel</th>
                      <th>Phone</th>
                      <th>Verification</th>
                      <th>Availability</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="bangkeroTableBody"></tbody>
                </table>
              </div>

              <p id="emptyState" class="cg-empty d-none">
                No bangkero records match your filters.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../../assets/js/services/supabase.js"></script>
  <script src="../../../assets/js/services/bangkeros.js"></script>
  <script src="../../../assets/js/services/realtime.js"></script>

  <script>
    let bangkeros = [];

    const tbody = document.getElementById("bangkeroTableBody");
    const searchInput = document.getElementById("bangkeroSearchInput");
    const statusFilter = document.getElementById("statusFilter");
    const verificationFilter = document.getElementById("verificationFilter");
    const resetBtn = document.getElementById("resetBtn");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");

    function mapStatus(b) {
      if (!b.isAvailable) return 'Suspended';
      if (b.verificationStat !== 'verified') return 'Pending Verification';
      return 'On Duty';
    }

    function badgeClass(status){
      if (status === "On Duty") return "text-bg-info";
      if (status === "Active" || status === "Pending Verification") return "text-bg-warning";
      return "text-bg-danger";
    }

    function verificationBadge(stat) {
      const map = {
        'verified': 'text-bg-success',
        'pending': 'text-bg-warning',
        'rejected': 'text-bg-danger'
      };
      return map[stat] || 'text-bg-secondary';
    }

    function renderRows(data){
      tbody.innerHTML = "";

      if (data.length === 0) emptyState.classList.remove("d-none");
      else emptyState.classList.add("d-none");

      data.forEach(b => {
        const status = mapStatus(b);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${b.uid.slice(0,8)}</td>
          <td>${b.displayName}</td>
          <td>${b.permitNumber || 'N/A'}</td>
          <td>${b.boatName || 'Unassigned'}</td>
          <td>${b.phoneNumber ? b.phoneNumber.replace('+63', '0') : 'N/A'}</td>
          <td><span class="badge ${verificationBadge(b.verificationStat)}">${b.verificationStat}</span></td>
          <td>${b.isAvailable ? '<span class="badge text-bg-success">Online</span>' : '<span class="badge text-bg-secondary">Offline</span>'}</td>
          <td><span class="badge ${badgeClass(status)}">${status}</span></td>
        `;
        tbody.appendChild(tr);
      });

      resultCount.textContent = `Showing ${data.length} bangkero record(s)`;
    }

    function runFilter(){
      const q = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;
      const verification = verificationFilter.value;

      const filtered = bangkeros.filter(b => {
        const derivedStatus = mapStatus(b);
        const textMatch =
          b.uid.toLowerCase().includes(q) ||
          b.displayName.toLowerCase().includes(q) ||
          (b.permitNumber || '').toLowerCase().includes(q) ||
          (b.phoneNumber || '').toLowerCase().includes(q) ||
          (b.boatName || '').toLowerCase().includes(q);

        const statusMatch = status ? derivedStatus === status : true;
        const verificationMatch = verification ? b.verificationStat === verification : true;

        return textMatch && statusMatch && verificationMatch;
      });

      renderRows(filtered);
    }

    searchInput.addEventListener("input", runFilter);
    statusFilter.addEventListener("change", runFilter);
    verificationFilter.addEventListener("change", runFilter);

    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      statusFilter.value = "";
      verificationFilter.value = "";
      renderRows(bangkeros);
    });

    async function loadBangkeros() {
      try {
        bangkeros = await window.bangkagoBangkeros.listAll();
        // Enrich with boat and user data for UI display
        bangkeros = await window.bangkagoBangkeros.enrichBangkeros(bangkeros);
        renderRows(bangkeros);
      } catch(e) {
        console.error(e);
        emptyState.textContent = 'Error loading bangkeros: ' + e.message;
        emptyState.classList.remove("d-none");
      }
    }

    // Real-time updates
    window.bangkagoRealtime.subscribe('bangkeros', null, function() {
      loadBangkeros();
    });
    window.bangkagoRealtime.subscribe('bangkas', null, function() {
      loadBangkeros();
    });

    // Initial load — wait for auth guard to complete and session to restore
    (async function () {
      try {
        await window.bangkagoAuthReady;
        await loadBangkeros();
      } catch (e) {
        console.error('Auth guard failed:', e);
        // Guard handles redirect
      }
    })();
  </script>
</body>
</html>
