<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo LGU/Coast Guard — View Active Alerts</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/coastguard-theme.css"/>
</head>
<body data-page="alerts">
  <div class="cg-shell">
    <div id="sidebarMount"></div>
    <main class="cg-main" id="cgMain">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="row g-3">
          <!-- Main alerts table -->
          <div class="col-xl-9">
            <div class="cg-card">
              <div class="panel-head">
                <h6 class="mb-0">View Active Alerts (Read-Only)</h6>
                <span class="readonly-pill"><i class="bi bi-eye-fill"></i> Read Only</span>
              </div>

              <!-- Filters -->
              <div class="row g-2 mb-3 align-items-end filter-row">
                <div class="col-12 col-sm-6 col-lg-4">
                  <label class="form-label visually-hidden" for="alertSearchInput">Search</label>
                  <input id="alertSearchInput" class="form-control w-100" type="text" placeholder="Search alert, vessel, zone">
                </div>
                <div class="col-6 col-sm-6 col-lg-3">
                  <label class="form-label visually-hidden" for="severityFilter">Severity</label>
                  <select id="severityFilter" class="form-select w-100">
                    <option value="">All Severity</option>
                    <option value="Critical">Critical</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                  </select>
                </div>
                <div class="col-6 col-sm-6 col-lg-3">
                  <label class="form-label visually-hidden" for="statusFilter">Status</label>
                  <select id="statusFilter" class="form-select w-100">
                    <option value="">All Status</option>
                    <option value="Open">Open</option>
                    <option value="Watching">Watching</option>
                    <option value="Acknowledged">Acknowledged</option>
                  </select>
                </div>
                <div class="col-12 col-sm-6 col-lg-2 d-grid">
                  <button id="resetBtn" class="btn btn-outline-secondary w-100" type="button"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
                </div>
              </div>

              <div id="alertResultCount" class="small text-secondary mb-2"></div>

              <div class="table-responsive">
                <table class="table table-theme align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Alert ID</th>
                      <th>Alert Type</th>
                      <th>Vessel</th>
                      <th>Zone</th>
                      <th>Time</th>
                      <th>Severity</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="alertsTableBody"></tbody>
                </table>
              </div>

              <p id="alertEmptyState" class="cg-empty d-none">
                No alerts matched your filters.
              </p>
            </div>
          </div>

          <!-- Side severity legend -->
          <div class="col-xl-3">
            <div class="cg-card h-100">
              <div class="panel-head">
                <h6 class="mb-0">Severity Legend</h6>
              </div>

              <div class="d-flex flex-column gap-2">
                <div class="d-flex align-items-center justify-content-between cg-legend-item">
                  <span><i class="bi bi-exclamation-octagon-fill text-danger me-2"></i>Critical</span>
                  <span class="badge text-bg-danger">Immediate Action</span>
                </div>

                <div class="d-flex align-items-center justify-content-between cg-legend-item">
                  <span><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>High</span>
                  <span class="badge text-bg-warning">Priority Watch</span>
                </div>

                <div class="d-flex align-items-center justify-content-between cg-legend-item">
                  <span><i class="bi bi-info-circle-fill text-info me-2"></i>Medium</span>
                  <span class="badge text-bg-info">Monitor</span>
                </div>
              </div>

              <hr>
              <h6 class="mb-2">Status Meaning</h6>
              <div class="small text-secondary mb-2"><span class="badge text-bg-danger me-2">Open</span> Not yet resolved</div>
              <div class="small text-secondary mb-2"><span class="badge text-bg-warning me-2">Watching</span> Under observation</div>
              <div class="small text-secondary"><span class="badge text-bg-success me-2">Acknowledged</span> Logged by station</div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/coastguard-theme.js"></script>
  <script src="assets/js/layout-loader.js"></script>
  <script>
    const alerts = [
      { id: "ALT-904", type: "Route Deviation", vessel: "Boat 03", zone: "South Passage", time: "14:49", severity: "High", status: "Open" },
      { id: "ALT-901", type: "Weather Warning", vessel: "Boat 08", zone: "East Crossing", time: "14:41", severity: "Medium", status: "Watching" },
      { id: "ALT-897", type: "Signal Loss", vessel: "Boat 11", zone: "Caohagan Port Channel", time: "14:34", severity: "Critical", status: "Open" },
      { id: "ALT-892", type: "Overcapacity Risk", vessel: "Boat 15", zone: "Olango Port Exit", time: "14:22", severity: "High", status: "Acknowledged" },
      { id: "ALT-888", type: "Unauthorized Stop", vessel: "Boat 06", zone: "North Channel", time: "14:15", severity: "Medium", status: "Watching" }
    ];

    const tbody = document.getElementById("alertsTableBody");
    const searchInput = document.getElementById("alertSearchInput");
    const severityFilter = document.getElementById("severityFilter");
    const statusFilter = document.getElementById("statusFilter");
    const resetBtn = document.getElementById("resetBtn");
    const countEl = document.getElementById("alertResultCount");
    const emptyEl = document.getElementById("alertEmptyState");

    function sevBadge(sev){
      if (sev === "Critical") return "text-bg-danger";
      if (sev === "High") return "text-bg-warning";
      return "text-bg-info";
    }

    function statusBadge(st){
      if (st === "Open") return "text-bg-danger";
      if (st === "Watching") return "text-bg-warning";
      return "text-bg-success";
    }

    function renderRows(data){
      tbody.innerHTML = "";

      if (data.length === 0) emptyEl.classList.remove("d-none");
      else emptyEl.classList.add("d-none");

      data.forEach(a => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${a.id}</td>
          <td>${a.type}</td>
          <td><strong>${a.vessel}</strong></td>
          <td>${a.zone}</td>
          <td>${a.time}</td>
          <td><span class="badge ${sevBadge(a.severity)}">${a.severity}</span></td>
          <td><span class="badge ${statusBadge(a.status)}">${a.status}</span></td>
        `;
        tbody.appendChild(tr);
      });

      countEl.textContent = `Showing ${data.length} active alert(s)`;
    }

    function runFilter(){
      const q = searchInput.value.trim().toLowerCase();
      const severity = severityFilter.value;
      const status = statusFilter.value;

      const filtered = alerts.filter(a => {
        const textMatch =
          a.id.toLowerCase().includes(q) ||
          a.type.toLowerCase().includes(q) ||
          a.vessel.toLowerCase().includes(q) ||
          a.zone.toLowerCase().includes(q);

        const sevMatch = severity ? a.severity === severity : true;
        const statusMatch = status ? a.status === status : true;

        return textMatch && sevMatch && statusMatch;
      });

      renderRows(filtered);
    }

    searchInput.addEventListener("input", runFilter);
    severityFilter.addEventListener("change", runFilter);
    statusFilter.addEventListener("change", runFilter);

    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      severityFilter.value = "";
      statusFilter.value = "";
      renderRows(alerts);
    });

    renderRows(alerts);
  </script>
</body>
</html>
