<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BangkaGo Admin — Manage Alerts</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-theme.css"/>
  <style>
    .summary-box{border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50);padding:.7rem .85rem;}
  </style>
</head>
<body data-page="manage-alerts">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Manage Alerts</h6>
            <span class="muted-note">Create alerts, resolve issues, and send notifications</span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-3 d-grid">
              <button class="btn btn-bangkago" id="openCreateAlertBtn">
                <i class="bi bi-plus-circle me-1"></i> Create Alert
              </button>
            </div>
            <div class="col-md-4">
              <input id="alertSearch" class="form-control" placeholder="Search ID, title, or message">
            </div>
            <div class="col-md-2">
              <select id="levelFilter" class="form-select">
                <option value="">All Levels</option>
                <option value="Info">Info</option>
                <option value="Warning">Warning</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
            <div class="col-md-2">
              <select id="statusFilter" class="form-select">
                <option value="">All Status</option>
                <option value="Open">Open</option>
                <option value="Resolved">Resolved</option>
              </select>
            </div>
            <div class="col-md-1 d-grid">
              <button id="alertReset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Message</th>
                  <th>Level</th>
                  <th>Status</th>
                  <th style="width:280px;">Actions</th>
                </tr>
              </thead>
              <tbody id="alertBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- CREATE ALERT MODAL -->
  <div class="modal fade" id="createAlertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="createAlertForm">
        <div class="modal-header">
          <h5 class="modal-title">Create Alert</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Alert Title</label>
            <input id="alertTitle" class="form-control" placeholder="e.g. High Waves" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Alert Message</label>
            <textarea id="alertMsg" class="form-control" rows="3" placeholder="Describe the alert..." required></textarea>
          </div>
          <div class="mb-0">
            <label class="form-label">Alert Level</label>
            <select id="alertLevel" class="form-select" required>
              <option value="Info">Info</option>
              <option value="Warning">Warning</option>
              <option value="Critical">Critical</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-bangkago">Create Alert</button>
        </div>
      </form>
    </div>
  </div>

  <!-- UPDATE/RESOLVE ALERT MODAL -->
  <div class="modal fade" id="updateAlertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="updateAlertForm">
        <div class="modal-header">
          <h5 class="modal-title">Update Alert Status</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="summary-box mb-3">
            <div><strong>Alert ID:</strong> <span id="uId">-</span></div>
            <div><strong>Title:</strong> <span id="uTitle">-</span></div>
            <div><strong>Level:</strong> <span id="uLevel">-</span></div>
          </div>

          <div class="mb-2">
            <label class="form-label">Status</label>
            <select id="uStatus" class="form-select">
              <option value="Open">Open</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>

          <div class="mb-0">
            <label class="form-label">Resolution Notes</label>
            <textarea id="uNotes" class="form-control" rows="3" placeholder="Optional notes..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-dark">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- SEND NOTIFICATION MODAL -->
  <div class="modal fade" id="notifyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="notifyForm">
        <div class="modal-header">
          <h5 class="modal-title">Send Notification</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="summary-box mb-3">
            <div><strong>Alert ID:</strong> <span id="nId">-</span></div>
            <div><strong>Title:</strong> <span id="nTitle">-</span></div>
          </div>

          <div class="mb-2">
            <label class="form-label">Recipients</label>
            <select id="nRecipients" class="form-select">
              <option value="All Operators">All Operators</option>
              <option value="Coast Guard">Coast Guard</option>
              <option value="LGU">LGU</option>
              <option value="Admins Only">Admins Only</option>
            </select>
          </div>

          <div class="mb-0">
            <label class="form-label">Notification Message</label>
            <textarea id="nMessage" class="form-control" rows="3" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-primary">Send</button>
        </div>
      </form>
    </div>
  </div>

  <!-- RESULT MODAL -->
  <div class="modal fade" id="resultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Action Completed</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="resultBox"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>`n  <script src="assets/js/admin-theme.js"></script>
  <script src="assets/js/layout-loader.js"></script>

  <script>
    let alerts = [
      {id:'AL-01', title:'High Waves', msg:'Route R-04 may be unsafe.', level:'Warning', status:'Open', notes:''},
      {id:'AL-02', title:'Engine Failure', msg:'Boat 15 needs immediate check.', level:'Critical', status:'Open', notes:''},
      {id:'AL-03', title:'Port Congestion', msg:'Expected delays at Marigondon Port.', level:'Info', status:'Resolved', notes:'Traffic normalized'}
    ];

    let selectedIndex = null;

    const body = document.getElementById('alertBody');
    const alertSearch = document.getElementById('alertSearch');
    const levelFilter = document.getElementById('levelFilter');
    const statusFilter = document.getElementById('statusFilter');

    const createAlertModal = new bootstrap.Modal('#createAlertModal');
    const updateAlertModal = new bootstrap.Modal('#updateAlertModal');
    const notifyModal = new bootstrap.Modal('#notifyModal');
    const resultModal = new bootstrap.Modal('#resultModal');

    function lvlBadge(level){
      if(level === 'Critical') return 'text-bg-danger';
      if(level === 'Warning') return 'text-bg-warning';
      return 'text-bg-info';
    }

    function stBadge(status){
      return status === 'Resolved' ? 'text-bg-success' : 'text-bg-warning';
    }

    function render(data){
      body.innerHTML = '';
      data.forEach(alert => {
        const i = alerts.findIndex(a => a.id === alert.id);
        body.innerHTML += `
          <tr>
            <td>${alert.id}</td>
            <td>${alert.title}</td>
            <td>${alert.msg}</td>
            <td><span class="badge ${lvlBadge(alert.level)}">${alert.level}</span></td>
            <td><span class="badge ${stBadge(alert.status)}">${alert.status}</span></td>
            <td>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-dark action-btn" onclick="openUpdateAlert(${i})">
                  <i class="bi bi-check2-square"></i> Resolve
                </button>
                <button class="btn btn-sm btn-outline-primary action-btn" onclick="openNotify(${i})">
                  <i class="bi bi-bell"></i> Notify
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    function runFilter(){
      const q = alertSearch.value.toLowerCase().trim();
      const l = levelFilter.value;
      const s = statusFilter.value;

      const filtered = alerts.filter(a => {
        const textMatch =
          a.id.toLowerCase().includes(q) ||
          a.title.toLowerCase().includes(q) ||
          a.msg.toLowerCase().includes(q);

        const levelMatch = l ? a.level === l : true;
        const statusMatch = s ? a.status === s : true;
        return textMatch && levelMatch && statusMatch;
      });

      render(filtered);
    }

    // Open create modal
    document.getElementById('openCreateAlertBtn').addEventListener('click', () => {
      createAlertModal.show();
    });

    // Create alert submit
    document.getElementById('createAlertForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const id = `AL-${String(alerts.length + 1).padStart(2, '0')}`;
      alerts.unshift({
        id,
        title: document.getElementById('alertTitle').value.trim(),
        msg: document.getElementById('alertMsg').value.trim(),
        level: document.getElementById('alertLevel').value,
        status: 'Open',
        notes: ''
      });

      createAlertModal.hide();
      e.target.reset();
      runFilter();
    });

    // Open update/resolve modal
    window.openUpdateAlert = function(i){
      selectedIndex = i;
      const a = alerts[i];

      document.getElementById('uId').textContent = a.id;
      document.getElementById('uTitle').textContent = a.title;
      document.getElementById('uLevel').textContent = a.level;
      document.getElementById('uStatus').value = a.status;
      document.getElementById('uNotes').value = a.notes || '';

      updateAlertModal.show();
    }

    // Save update/resolve
    document.getElementById('updateAlertForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if(selectedIndex === null) return;

      alerts[selectedIndex].status = document.getElementById('uStatus').value;
      alerts[selectedIndex].notes = document.getElementById('uNotes').value.trim();

      updateAlertModal.hide();
      runFilter();

      document.getElementById('resultBox').innerHTML = `
        <div class="alert alert-success mb-0">
          Alert <strong>${alerts[selectedIndex].id}</strong> updated to
          <strong>${alerts[selectedIndex].status}</strong>.
        </div>
      `;
      resultModal.show();
    });

    // Open notify modal
    window.openNotify = function(i){
      selectedIndex = i;
      const a = alerts[i];

      document.getElementById('nId').textContent = a.id;
      document.getElementById('nTitle').textContent = a.title;
      document.getElementById('nRecipients').value = 'All Operators';
      document.getElementById('nMessage').value = `[${a.level}] ${a.title}: ${a.msg}`;

      notifyModal.show();
    }

    // Send notification
    document.getElementById('notifyForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if(selectedIndex === null) return;

      const recipients = document.getElementById('nRecipients').value;

      notifyModal.hide();
      document.getElementById('resultBox').innerHTML = `
        <div class="alert alert-success mb-2">
          Notification sent successfully.
        </div>
        <div class="summary-box">
          <div><strong>Alert:</strong> ${alerts[selectedIndex].id} - ${alerts[selectedIndex].title}</div>
          <div><strong>Recipients:</strong> ${recipients}</div>
        </div>
      `;
      resultModal.show();
    });

    // Filters
    alertSearch.addEventListener('input', runFilter);
    levelFilter.addEventListener('change', runFilter);
    statusFilter.addEventListener('change', runFilter);

    document.getElementById('alertReset').addEventListener('click', () => {
      alertSearch.value = '';
      levelFilter.value = '';
      statusFilter.value = '';
      render(alerts);
    });

    render(alerts);
  </script>
</body>
</html>
