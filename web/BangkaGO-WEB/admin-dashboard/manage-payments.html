<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BangkaGo Admin — Manage Payments</title>

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin-theme.css"/>
  <style>
    .summary-box{border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50);padding:.7rem .85rem;}
  </style>
</head>
<body data-page="manage-payments">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Manage Payments</h6>
            <span class="muted-note">View transactions and generate professional payment reports</span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-4">
              <input id="paymentSearch" class="form-control" placeholder="Search payment ID, booking ID, payer">
            </div>
            <div class="col-md-3">
              <select id="paymentStatusFilter" class="form-select">
                <option value="">All Status</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="failed">Failed</option>
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button id="paymentReset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0">
              <thead>
                <tr>
                  <th>Payment ID</th>
                  <th>Booking ID</th>
                  <th>Payer</th>
                  <th>Amount</th>
                  <th>Method</th>
                  <th>Status</th>
                  <th style="min-width: 240px;">Actions</th>
                </tr>
              </thead>
              <tbody id="payBody"></tbody>
            </table>
          </div>
          
          <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2 text-muted">Loading payments...</p>
          </div>
          
          <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- VIEW PAYMENT MODAL -->
  <div class="modal fade" id="viewPaymentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">View Payment Details</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="paymentDetailsBox"></div>
      </div>
    </div>
  </div>

  <!-- GENERATE REPORT MODAL -->
  <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="reportForm">
        <div class="modal-header">
          <h5 class="modal-title">Generate Payment Report</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="summary-box mb-3">
            <div><strong>Payment ID:</strong> <span id="rPaymentId">-</span></div>
            <div><strong>Payer:</strong> <span id="rPayer">-</span></div>
            <div><strong>Amount:</strong> <span id="rAmount">-</span></div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label">From Date</label>
              <input type="date" id="rFrom" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">To Date</label>
              <input type="date" id="rTo" class="form-control" required>
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Report Type</label>
            <select id="rType" class="form-select">
              <option value="Transaction Summary">Transaction Summary</option>
              <option value="Detailed Audit">Detailed Audit</option>
              <option value="Collection Statement">Collection Statement</option>
            </select>
          </div>

          <div class="mb-0">
            <label class="form-label">Notes (optional)</label>
            <textarea id="rNotes" class="form-control" rows="3" placeholder="Add remarks for this report..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-dark">
            <i class="bi bi-file-earmark-text me-1"></i> Generate
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- REPORT RESULT MODAL -->
  <div class="modal fade" id="reportResultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Payment Report Generated</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="reportResultBox"></div>
      </div>
    </div>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../assets/js/services/supabase.js"></script>
  <script src="../../assets/js/services/payments.js"></script>
  <script src="../../assets/js/services/bookings.js"></script>
  <script src="../../assets/js/services/realtime.js"></script>

  <script>
    let payments = [];
    let selectedIndex = null;

    const tbody = document.getElementById('payBody');
    const paymentSearch = document.getElementById('paymentSearch');
    const paymentStatusFilter = document.getElementById('paymentStatusFilter');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    const viewPaymentModal = new bootstrap.Modal('#viewPaymentModal');
    const reportModal = new bootstrap.Modal('#reportModal');
    const reportResultModal = new bootstrap.Modal('#reportResultModal');

    function peso(n){
      return `₱${Number(n).toLocaleString('en-PH', {minimumFractionDigits:2})}`;
    }

    function badge(status){
      if(status === 'completed') return 'text-bg-success';
      if(status === 'pending') return 'text-bg-warning';
      if(status === 'failed') return 'text-bg-danger';
      return 'text-bg-info';
    }

    function displayStatus(status){
      const map = { completed: 'Paid', pending: 'Pending', failed: 'Failed' };
      return map[status] || status;
    }

    function showLoading(show) {
      loadingState.classList.toggle('d-none', !show);
      errorState.classList.add('d-none');
    }

    function showError(msg) {
      loadingState.classList.add('d-none');
      errorState.textContent = msg;
      errorState.classList.remove('d-none');
    }

    function render(data){
      tbody.innerHTML = data.map((p) => `
          <tr>
            <td>${p.paymentId.slice(0,12)}...</td>
            <td>${p.bookingId ? p.bookingId.slice(0,12)+'...' : 'N/A'}</td>
            <td>${p.payerName || 'Unknown'}</td>
            <td>${peso(p.amount)}</td>
            <td>${p.paymentMethod}</td>
            <td><span class="badge ${badge(p.paymentStatus)}">${displayStatus(p.paymentStatus)}</span></td>
            <td>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-primary action-btn" onclick="viewPayment('${p.paymentId}')">
                  <i class="bi bi-eye"></i> View
                </button>
                <button class="btn btn-sm btn-outline-dark action-btn" onclick="openReport('${p.paymentId}')">
                  <i class="bi bi-file-earmark-text"></i> Report
                </button>
              </div>
            </td>
          </tr>
      `).join('');
    }

    function runFilter(){
      const q = paymentSearch.value.toLowerCase().trim();
      const s = paymentStatusFilter.value;

      const filtered = payments.filter(p => {
        const textMatch =
          p.paymentId.toLowerCase().includes(q) ||
          (p.bookingId || '').toLowerCase().includes(q) ||
          (p.payerName || '').toLowerCase().includes(q);

        const statusMatch = s ? p.paymentStatus === s : true;
        return textMatch && statusMatch;
      });

      render(filtered);
    }

    // By id: the table renders the FILTERED list, so a row index here
    // would open a different payment whenever a search is active.
    window.viewPayment = function(paymentId){
      const p = payments.find(x => x.paymentId === paymentId);
      if (!p) return;
      document.getElementById('paymentDetailsBox').innerHTML = `
        <div class="summary-box mb-2"><strong>Payment ID:</strong> ${p.paymentId}</div>
        <div class="summary-box mb-2"><strong>Booking ID:</strong> ${p.bookingId || 'N/A'}</div>
        <div class="summary-box mb-2"><strong>Payer:</strong> ${p.payerName || 'Unknown'}</div>
        <div class="summary-box mb-2"><strong>Amount:</strong> ${peso(p.amount)}</div>
        <div class="summary-box mb-2"><strong>Method:</strong> ${p.paymentMethod}</div>
        <div class="summary-box mb-2"><strong>Status:</strong> <span class="badge ${badge(p.paymentStatus)}">${displayStatus(p.paymentStatus)}</span></div>
        <div class="summary-box mb-0"><strong>Reference:</strong> ${p.referenceNum || 'N/A'}</div>
        <div class="summary-box mb-0"><strong>Created:</strong> ${new Date(p.createdAt).toLocaleString()}</div>
      `;
      viewPaymentModal.show();
    }

    window.openReport = function(paymentId){
      selectedIndex = payments.findIndex(x => x.paymentId === paymentId);
      if (selectedIndex === -1) return;
      const p = payments[selectedIndex];

      document.getElementById('rPaymentId').textContent = p.paymentId;
      document.getElementById('rPayer').textContent = p.payerName || 'Unknown';
      document.getElementById('rAmount').textContent = peso(p.amount);

      document.getElementById('rFrom').value = p.createdAt.split('T')[0];
      document.getElementById('rTo').value = p.createdAt.split('T')[0];
      document.getElementById('rType').value = 'Transaction Summary';
      document.getElementById('rNotes').value = '';

      reportModal.show();
    }

    document.getElementById('reportForm').addEventListener('submit', function(e){
      e.preventDefault();
      if(selectedIndex === null) return;

      const p = payments[selectedIndex];
      const from = document.getElementById('rFrom').value;
      const to = document.getElementById('rTo').value;
      const type = document.getElementById('rType').value;
      const notes = document.getElementById('rNotes').value.trim();

      if(from > to){
        alert('Invalid date range: "From Date" cannot be later than "To Date".');
        return;
      }

      reportModal.hide();

      document.getElementById('reportResultBox').innerHTML = `
        <div class="alert alert-success">
          <strong>${type}</strong> generated successfully.
        </div>

        <div class="summary-box mb-2"><strong>Payment ID:</strong> ${p.paymentId}</div>
        <div class="summary-box mb-2"><strong>Payer:</strong> ${p.payerName || 'Unknown'}</div>
        <div class="summary-box mb-2"><strong>Booking ID:</strong> ${p.bookingId || 'N/A'}</div>
        <div class="summary-box mb-2"><strong>Amount:</strong> ${peso(p.amount)}</div>
        <div class="summary-box mb-2"><strong>Date Range:</strong> ${from} to ${to}</div>
        <div class="summary-box mb-0"><strong>Notes:</strong> ${notes || '-'}</div>

        <div class="mt-3 d-grid">
          <button class="btn btn-outline-dark" onclick="alert('Download started (demo).')">
            <i class="bi bi-download me-1"></i> Download Report
          </button>
        </div>
      `;

      reportResultModal.show();
    });

    paymentSearch.addEventListener('input', runFilter);
    paymentStatusFilter.addEventListener('change', runFilter);

    document.getElementById('paymentReset').addEventListener('click', () => {
      paymentSearch.value = '';
      paymentStatusFilter.value = '';
      render(payments);
    });

    async function loadPayments() {
      showLoading(true);
      try {
        const [pays, downs] = await Promise.all([
          window.bangkagoPayments.listPayments({ limit: 100 }),
          window.bangkagoPayments.listDownpayments({ limit: 100 })
        ]);
        
        // Normalize payments
        payments = pays.map(p => ({
          ...p,
          payerName: p.booking?.passenger_name || p.user?.first_name + ' ' + p.user?.last_name || 'Unknown'
        })).concat(
          downs.map(d => ({
            paymentId: d.downpaymentId,
            bookingId: d.bookingId || d.boatRentalId,
            payerName: d.user?.first_name + ' ' + d.user?.last_name || 'Unknown',
            amount: d.amount,
            paymentMethod: 'GCash',
            paymentStatus: d.status,
            referenceNum: d.referenceNum,
            createdAt: d.createdAt,
            type: 'downpayment'
          }))
        ).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

        render(payments);
        showLoading(false);
      } catch(e) {
        console.error(e);
        showError('Failed to load payments: ' + e.message);
      }
    }

    // Real-time updates
    window.bangkagoRealtime.subscribe('payments', null, function() {
      loadPayments();
    });
    window.bangkagoRealtime.subscribe('downpayments', null, function() {
      loadPayments();
    });

    // Initial load — wait for auth guard to complete and session to restore
    (async function () {
      try {
        await window.bangkagoAuthReady;
        await loadPayments();
      } catch (e) {
        console.error('Auth guard failed:', e);
        // Never auto-redirect from here: the guard already distinguishes
        // 'signed out' (bounces you) from 'can't verify' (stays put).
        showError('Could not verify your session (connection problem). Refresh the page to retry.');
        
      }
    })();
  </script>
</body>
</html>
