<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Admin — Port Queues</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png" />

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin-theme.css"/>
</head>
<body data-page="port-queues">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Port Queues</h6>
            <span class="muted-note">Boats waiting at each port, in the order dispatch will offer them a trip</span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-3">
              <input id="qSearch" class="form-control" placeholder="Search bangkero or port" aria-label="Search queues">
            </div>
            <div class="col-md-3">
              <select id="qPortFilter" class="form-select" aria-label="Filter by port">
                <option value="">All Ports</option>
              </select>
            </div>
          </div>

          <div id="queueGroups"></div>

          <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2 text-muted">Loading port queues...</p>
          </div>

          <div id="emptyState" class="alert alert-light border text-muted mb-0 d-none">
            No boats are waiting at any port right now. A boat appears here when it enters a port&apos;s queue radius.
          </div>

          <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <script src="../../assets/js/services/supabase.js"></script>
  <script src="../../assets/js/services/queues.js"></script>
  <script src="../../assets/js/services/realtime.js"></script>

  <style>
    .q-port{border:1px solid var(--gray-200);border-radius:12px;margin-bottom:1rem;overflow:hidden;}
    .q-port-head{display:flex;align-items:baseline;justify-content:space-between;gap:.75rem;
      background:var(--gray-50);padding:.7rem .9rem;border-bottom:1px solid var(--gray-200);}
    .q-port-head h6{margin:0;font-weight:700;}
    .q-rank{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
      border-radius:999px;background:var(--gray-100);color:var(--brand,#0f766e);font-size:.75rem;font-weight:700;}
    .q-dot{display:inline-block;width:7px;height:7px;border-radius:999px;margin-right:.35rem;}
    .q-dwell{white-space:nowrap;font-size:.75rem;font-weight:700;color:#b45309;}
    .q-dwell.ready{color:var(--brand,#0f766e);}
  </style>

  <script>
    // DWELL_MS mirrors src/services/queue.service.ts (5 minutes). A boat that
    // has sat longer than this is "ready": dispatch already treats it as
    // settled in, and only then can it be offered a trip.
    var DWELL_MS = 5 * 60 * 1000;

    var queues = [];
    var groupsEl = document.getElementById('queueGroups');
    var qSearch = document.getElementById('qSearch');
    var qPortFilter = document.getElementById('qPortFilter');
    var loadingState = document.getElementById('loadingState');
    var emptyState = document.getElementById('emptyState');
    var errorState = document.getElementById('errorState');
    var clockTimer = null;

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function clock(ms) {
      var s = Math.max(0, Math.ceil(ms / 1000));
      return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }

    function enteredTime(iso) {
      var d = new Date(iso);
      return isNaN(d.getTime()) ? '' : d.toLocaleTimeString('en-PH', {
        timeZone: 'Asia/Manila', hour: '2-digit', minute: '2-digit'
      });
    }

    function showLoading(show) {
      loadingState.classList.toggle('d-none', !show);
      if (show) errorState.classList.add('d-none');
    }

    function showError(msg) {
      loadingState.classList.add('d-none');
      emptyState.classList.add('d-none');
      groupsEl.innerHTML = '';
      errorState.textContent = msg;
      errorState.classList.remove('d-none');
    }

    function portName(row) { return row.portName || row.portId; }

    // One filter source for both the port dropdown and the search box, so the
    // dropdown can never offer a port that is no longer queued.
    function syncPortFilter() {
      var current = qPortFilter.value;
      var names = Array.from(new Set(queues.map(portName))).sort(function(a, b) { return a.localeCompare(b); });
      qPortFilter.innerHTML = '<option value="">All Ports</option>' + names.map(function(n) {
        return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
      }).join('');
      qPortFilter.value = names.indexOf(current) >= 0 ? current : '';
    }

    function render() {
      var q = qSearch.value.toLowerCase().trim();
      var port = qPortFilter.value;
      var rows = queues.filter(function(r) {
        var hay = (portName(r) + ' ' + (r.displayName || '')).toLowerCase();
        return (!port || portName(r) === port) && (!q || hay.includes(q));
      });

      emptyState.classList.add('d-none');
      if (!rows.length) {
        groupsEl.innerHTML = '';
        emptyState.classList.remove('d-none');
        return;
      }

      // Group per port, FCFS inside each (the API already sorts by entered_at).
      var order = [];
      var byPort = {};
      rows.forEach(function(r) {
        var key = portName(r);
        if (!byPort[key]) { byPort[key] = []; order.push(key); }
        byPort[key].push(r);
      });
      order.sort(function(a, b) { return a.localeCompare(b); });

      groupsEl.innerHTML = order.map(function(name) {
        var list = byPort[name];
        return '' +
          '<div class="q-port">' +
            '<div class="q-port-head">' +
              '<h6>' + esc(name) + '</h6>' +
              '<span class="text-muted small">' + list.length + ' boat' + (list.length === 1 ? '' : 's') + '</span>' +
            '</div>' +
            '<table class="table table-theme align-middle mb-0">' +
              '<thead><tr>' +
                '<th style="width:56px;">#</th><th>Bangka / bangkero</th>' +
                '<th style="width:150px;">Listed</th><th style="width:130px;">Dwell</th>' +
              '</tr></thead>' +
              '<tbody>' +
                list.map(function(r, i) {
                  var online = r.isAvailable !== false;
                  return '<tr>' +
                    '<td><span class="q-rank">' + (i + 1) + '</span></td>' +
                    '<td>' + esc(r.displayName || 'Unnamed boat') +
                      '<div class="small text-muted">' +
                        '<span class="q-dot" style="background:' + (online ? '#0f766e' : '#9ca3af') + '"></span>' +
                        (online ? 'Ready for a trip' : 'Offline') +
                      '</div>' +
                    '</td>' +
                    '<td class="small text-muted">' + esc(enteredTime(r.enteredAt)) + '</td>' +
                    '<td class="q-dwell" data-entered="' + esc(r.enteredAt) + '"></td>' +
                  '</tr>';
                }).join('') +
              '</tbody>' +
            '</table>' +
          '</div>';
      }).join('');

      tickDwell();
    }

    // Reload is coalesced by realtime.js, so re-rendering on every tick is
    // cheap; the countdown itself only needs the DOM text updated.
    function tickDwell() {
      var now = Date.now();
      groupsEl.querySelectorAll('.q-dwell').forEach(function(cell) {
        var started = new Date(cell.dataset.entered).getTime();
        if (isNaN(started)) { cell.textContent = ''; return; }
        var left = DWELL_MS - (now - started);
        cell.textContent = left > 0 ? 'dwell ' + clock(left) : 'ready';
        cell.classList.toggle('ready', left <= 0);
      });
    }

    function startClock() {
      if (clockTimer) return;
      clockTimer = setInterval(tickDwell, 1000);
    }

    qSearch.addEventListener('input', render);
    qPortFilter.addEventListener('change', render);

    async function loadQueues() {
      showLoading(true);
      try {
        queues = await window.bangkagoQueues.listActiveQueues();
        showLoading(false);
        syncPortFilter();
        render();
      } catch (e) {
        console.error(e);
        showError('Failed to load port queues: ' + e.message);
      }
    }

    startClock();
    window.bangkagoRealtime.subscribe('port_queue', null, loadQueues);
    // A boat is only "ready" once it has sat out the dwell, and leaving the
    // queue is a row update — no other table changes this list.

    (async function () {
      try {
        await window.bangkagoAuthReady;
        await loadQueues();
      } catch (e) {
        console.error('Auth guard failed:', e);
        showError('Could not verify your session (connection problem). Refresh the page to retry.');
      }
    })();
  </script>
</body>
</html>
