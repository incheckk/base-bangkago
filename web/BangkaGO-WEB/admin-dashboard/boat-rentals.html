<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Admin — Boat Rentals</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png" />

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin-theme.css"/>
</head>
<body data-page="boat-rentals">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Boat Rentals</h6>
            <span class="muted-note">View all boat charter bookings (money actions in Downpayments)</span>
          </div>

          <!-- Status Filter Chips -->
          <div class="d-flex flex-wrap gap-2 mb-3" id="statusChips">
            <!-- Chips rendered dynamically -->
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0" id="rentalsTable">
              <thead>
                <tr>
                  <th>Event</th>
                  <th>Date</th>
                  <th>Boat</th>
                  <th>Renter</th>
                  <th>Hours</th>
                  <th>Total</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="rentalsBody"></tbody>
            </table>
          </div>
          
          <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2 text-muted">Loading rentals...</p>
          </div>
          
          <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../assets/js/services/supabase.js"></script>
  <script src="../../assets/js/services/rentals.js"></script>
  <script src="../../assets/js/services/realtime.js"></script>

  <script>
    let rentals = [];
    let currentFilter = 'all';

    const rentalsBody = document.getElementById('rentalsBody');
    const statusChips = document.getElementById('statusChips');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    const statusConfigs = [
      { key: 'all', label: 'All', badge: 'text-bg-secondary' },
      { key: 'pending', label: 'Pending', badge: 'text-bg-warning' },
      { key: 'awaiting_payment', label: 'Awaiting Payment', badge: 'text-bg-info' },
      { key: 'confirmed', label: 'Confirmed', badge: 'text-bg-primary' },
      { key: 'completed', label: 'Completed', badge: 'text-bg-success' },
      { key: 'cancelled', label: 'Cancelled', badge: 'text-bg-danger' }
    ];

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-PH', {
          weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
        });
      } catch {
        return dateStr;
      }
    }

    function peso(n) {
      return '₱' + Number(n).toLocaleString('en-PH', { minimumFractionDigits: 2 });
    }

    function renderChips() {
      statusChips.innerHTML = statusConfigs.map(function(s) {
        return `
          <button class="btn ${s.key === currentFilter ? 'btn-primary' : 'btn-outline-primary'} btn-sm"
                  onclick="setFilter('${s.key}')">
            ${s.label}
          </button>
        `;
      }).join('');
    }

    function showLoading(show) {
      loadingState.classList.toggle('d-none', !show);
      errorState.classList.add('d-none');
    }

    function showError(msg) {
      loadingState.classList.add('d-none');
      errorState.textContent = msg;
      errorState.classList.remove('d-none');
    }

    function renderTable(data) {
      if (data.length === 0) {
        rentalsBody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No rentals found</td></tr>';
        return;
      }
      rentalsBody.innerHTML = data.map(function(r) {
        const statusConfig = statusConfigs.find(s => s.key === r.status) || statusConfigs[0];
        const isAwaitingPayment = r.status === 'awaiting_payment';
        return `
          <tr>
            <td>${r.eventName || '—'}</td>
            <td>${formatDate(r.rentalDate)}</td>
            <td>${r.bangkaName || 'Unassigned'}</td>
            <td>${r.renterName || 'Unknown'}<br><small class="text-muted">${r.renterPhone || ''}</small></td>
            <td>${r.hours || 0}h</td>
            <td>${peso(r.totalPrice || 0)}</td>
            <td>
              <span class="badge ${statusConfig.badge}">${statusConfig.label || r.status}</span>
              ${isAwaitingPayment ? '<br><small class="text-warning"><i class="bi bi-info-circle me-1"></i>Escrow pending — review in Downpayments</small>' : ''}
            </td>
          </tr>
        `;
      }).join('');
    }

    function setFilter(filter) {
      currentFilter = filter;
      renderChips();
      const filtered = filter === 'all' ? rentals : rentals.filter(r => r.status === filter);
      renderTable(filtered);
    }

    async function loadRentals() {
      showLoading(true);
      try {
        rentals = await window.bangkagoRentals.listAll({ limit: 200 });
        renderChips();
        renderTable(currentFilter === 'all' ? rentals : rentals.filter(r => r.status === currentFilter));
        showLoading(false);
      } catch (e) {
        console.error(e);
        showError('Failed to load rentals: ' + e.message);
      }
    }

    // Real-time updates
    window.bangkagoRealtime.subscribe('boat_rentals', null, function() {
      loadRentals();
    });

    // Initial load — wait for auth guard to complete and session to restore
    (async function () {
      try {
        await window.bangkagoAuthReady;
        loadRentals();
      } catch (e) {
        console.error('Auth guard failed:', e);
        // Never auto-redirect from here: the guard already distinguishes
        // 'signed out' (bounces you) from 'can't verify' (stays put).
        showError('Could not verify your session (connection problem). Refresh the page to retry.');
      }
    })();
  </script>
</body>
</html>
