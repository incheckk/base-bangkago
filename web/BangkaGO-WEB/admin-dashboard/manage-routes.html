<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Admin — Manage Routes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-theme.css"/>
</head>
<body data-page="manage-routes">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Manage Routes</h6>
            <span class="muted-note">Travel corridors and stop management</span>
          </div>

          <div class="d-flex flex-wrap gap-2 mb-3">
            <button class="btn btn-bangkago" data-bs-toggle="modal" data-bs-target="#createRouteModal">
              <i class="bi bi-plus-circle me-1"></i> Create Route
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0" id="routesTable">
              <thead>
                <tr>
                  <th>Route ID</th>
                  <th>Path</th>
                  <th>Distance</th>
                  <th>Avg Time</th>
                  <th>Status</th>
                  <th style="min-width: 240px;">Actions</th>
                </tr>
              </thead>
              <tbody id="routesBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- CREATE ROUTE MODAL -->
  <div class="modal fade" id="createRouteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="createRouteForm">
        <div class="modal-header">
          <h5 class="modal-title">Create Route</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Route ID</label>
            <input id="cRouteId" class="form-control" placeholder="e.g. R-05" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Path</label>
            <input id="cRoutePath" class="form-control" placeholder="e.g. Mactan Port → Olango" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Distance</label>
            <input id="cRouteDistance" class="form-control" placeholder="e.g. 15 km" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Average Time</label>
            <input id="cRouteTime" class="form-control" placeholder="e.g. 45 min" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Status</label>
            <select id="cRouteStatus" class="form-select">
              <option value="Open">Open</option>
              <option value="Restricted">Restricted</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-bangkago">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- UPDATE ROUTE MODAL -->
  <div class="modal fade" id="updateRouteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="updateRouteForm">
        <div class="modal-header">
          <h5 class="modal-title">Update Route</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2"><strong>Route:</strong> <span id="uRouteLabel">-</span></div>
          <div class="mb-2">
            <label class="form-label">Path</label>
            <input id="uRoutePath" class="form-control" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Distance</label>
            <input id="uRouteDistance" class="form-control" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Average Time</label>
            <input id="uRouteTime" class="form-control" required />
          </div>
          <div class="mb-2">
            <label class="form-label">Status</label>
            <select id="uRouteStatus" class="form-select">
              <option value="Open">Open</option>
              <option value="Restricted">Restricted</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-dark">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MANAGE STOPS MODAL -->
  <div class="modal fade" id="manageStopsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Manage Route Stops</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2"><strong>Route:</strong> <span id="sRouteLabel">-</span></div>

          <div class="input-group mb-3">
            <input id="newStopInput" class="form-control" placeholder="Enter new stop name">
            <button class="btn btn-outline-secondary" id="addStopBtn" type="button">Add</button>
          </div>

          <ul class="list-group" id="stopsList"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin-theme.js"></script>
  <script src="assets/js/layout-loader.js"></script>

  <script>
    const routes = [
      {id:"R-01", path:"Marigondon Port → Olango", distance:"18 km", time:"52 min", status:"Open", stops:["Marigondon Port","Olango Channel","Olango Port"]},
      {id:"R-02", path:"Mactan Port → Olango", distance:"12 km", time:"34 min", status:"Open", stops:["Mactan Port","Olango"]},
      {id:"R-04", path:"Mactan Port → Caohagan", distance:"22 km", time:"64 min", status:"Restricted", stops:["Mactan Port","Caohagan Channel","Caohagan Port"]}
    ];

    let selectedIndex = null;

    const routesBody = document.getElementById("routesBody");

    const createRouteModal = new bootstrap.Modal(document.getElementById("createRouteModal"));
    const updateRouteModal = new bootstrap.Modal(document.getElementById("updateRouteModal"));
    const manageStopsModal = new bootstrap.Modal(document.getElementById("manageStopsModal"));

    const uRouteLabel = document.getElementById("uRouteLabel");
    const uRoutePath = document.getElementById("uRoutePath");
    const uRouteDistance = document.getElementById("uRouteDistance");
    const uRouteTime = document.getElementById("uRouteTime");
    const uRouteStatus = document.getElementById("uRouteStatus");

    const sRouteLabel = document.getElementById("sRouteLabel");
    const stopsList = document.getElementById("stopsList");
    const newStopInput = document.getElementById("newStopInput");

    function statusBadge(s){
      if(s==="Open") return "text-bg-success";
      if(s==="Restricted") return "text-bg-warning";
      if(s==="Closed") return "text-bg-danger";
      return "text-bg-secondary";
    }

    function renderTable(){
      routesBody.innerHTML = "";
      routes.forEach((r, i) => {
        routesBody.innerHTML += `
          <tr>
            <td>${r.id}</td>
            <td>${r.path}</td>
            <td>${r.distance}</td>
            <td>${r.time}</td>
            <td><span class="badge ${statusBadge(r.status)}">${r.status}</span></td>
            <td>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-primary action-btn" onclick="openUpdateRoute(${i})">
                  <i class="bi bi-pencil-square"></i> Update
                </button>
                <button class="btn btn-sm btn-outline-dark action-btn" onclick="openStops(${i})">
                  <i class="bi bi-geo-alt"></i> Stops
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    window.openUpdateRoute = function(index){
      selectedIndex = index;
      const r = routes[index];
      uRouteLabel.textContent = `${r.id} — ${r.path}`;
      uRoutePath.value = r.path;
      uRouteDistance.value = r.distance;
      uRouteTime.value = r.time;
      uRouteStatus.value = r.status;
      updateRouteModal.show();
    }

    window.openStops = function(index){
      selectedIndex = index;
      renderStops(index);
      manageStopsModal.show();
    }

    function renderStops(index){
      const r = routes[index];
      sRouteLabel.textContent = `${r.id} — ${r.path}`;
      stopsList.innerHTML = "";

      if(!r.stops.length){
        stopsList.innerHTML = `<li class="list-group-item text-muted">No stops yet.</li>`;
        return;
      }

      r.stops.forEach((stop, stopIndex) => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = `
          <span>${stop}</span>
          <button class="btn btn-sm btn-outline-danger" onclick="removeStop(${stopIndex})">
            <i class="bi bi-trash"></i>
          </button>
        `;
        stopsList.appendChild(li);
      });
    }

    window.removeStop = function(stopIndex){
      if(selectedIndex === null) return;
      routes[selectedIndex].stops.splice(stopIndex, 1);
      renderStops(selectedIndex);
    }

    document.getElementById("addStopBtn").addEventListener("click", () => {
      if(selectedIndex === null) return;
      const value = newStopInput.value.trim();
      if(!value) return;
      routes[selectedIndex].stops.push(value);
      newStopInput.value = "";
      renderStops(selectedIndex);
    });

    document.getElementById("createRouteForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const id = document.getElementById("cRouteId").value.trim();
      const path = document.getElementById("cRoutePath").value.trim();
      const distance = document.getElementById("cRouteDistance").value.trim();
      const time = document.getElementById("cRouteTime").value.trim();
      const status = document.getElementById("cRouteStatus").value;

      if(routes.some(r => r.id.toLowerCase() === id.toLowerCase())){
        alert("Route ID already exists.");
        return;
      }

      routes.push({ id, path, distance, time, status, stops: [] });
      renderTable();
      createRouteModal.hide();
      e.target.reset();
      alert("Route created successfully.");
    });

    document.getElementById("updateRouteForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if(selectedIndex === null) return;

      routes[selectedIndex].path = uRoutePath.value.trim();
      routes[selectedIndex].distance = uRouteDistance.value.trim();
      routes[selectedIndex].time = uRouteTime.value.trim();
      routes[selectedIndex].status = uRouteStatus.value;

      renderTable();
      updateRouteModal.hide();
      alert("Route updated successfully.");
    });

    renderTable();
  </script>
</body>
</html>
