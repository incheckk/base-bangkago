<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Coast Guard — Export Manifest</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png" />

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/coastguard-theme.css"/>
</head>
<body data-page="export-manifest">
  <div class="cg-shell">
    <div id="sidebarMount"></div>
    <main class="cg-main" id="cgMain">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="row g-3">
          <div class="col-12">
            <div class="cg-card">
              <div class="panel-head">
                <h6 class="mb-0">Export Manifest Snapshots</h6>
                <span class="readonly-pill"><i class="bi bi-eye-fill"></i> Read Only</span>
              </div>

              <!-- Filters -->
              <div class="row g-2 mb-3 align-items-end filter-row">
                <div class="col-12 col-md-4">
                  <label class="form-label visually-hidden" for="expSearchInput">Search</label>
                  <input id="expSearchInput" class="form-control w-100" type="text" placeholder="Search manifest, vessel, route">
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label visually-hidden" for="expStatusFilter">Status</label>
                  <select id="expStatusFilter" class="form-select w-100">
                    <option value="">All Status</option>
                    <option value="draft">Draft</option>
                    <option value="finalized">Finalized</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label visually-hidden" for="expDateFilter">Date</label>
                  <input id="expDateFilter" type="date" class="form-control w-100">
                </div>
                <div class="col-12 col-md-2 d-grid">
                  <button id="expResetBtn" class="btn btn-outline-secondary w-100" type="button"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
                </div>
              </div>

              <div id="expResultCount" class="small text-secondary mb-2"></div>

              <div class="table-responsive">
                <table class="table table-theme align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Manifest ID</th>
                      <th>Vessel</th>
                      <th>Bangkero</th>
                      <th>Date</th>
                      <th>Route</th>
                      <th>Passengers</th>
                      <th>Parcels</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="expTableBody"></tbody>
                </table>
              </div>

              <p id="expEmptyState" class="cg-empty d-none">
                No manifests found for export.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../../assets/js/services/supabase.js"></script>
  <script src="../../../assets/js/services/manifests.js"></script>
  <script src="../../../assets/js/services/realtime.js"></script>

  <script>
    let manifests = [];

    const tableBody = document.getElementById("expTableBody");
    const searchInput = document.getElementById("expSearchInput");
    const statusFilter = document.getElementById("expStatusFilter");
    const dateFilter = document.getElementById("expDateFilter");
    const resetBtn = document.getElementById("expResetBtn");
    const resultCount = document.getElementById("expResultCount");
    const emptyState = document.getElementById("expEmptyState");

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        return new Date(dateStr).toLocaleString('en-PH', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function statusBadge(status) {
      if (status === 'completed' || status === 'finalized') return "text-bg-success";
      if (status === 'draft') return "text-bg-warning";
      return "text-bg-info";
    }

    function statusText(status) {
      const map = {
        'draft': 'Draft',
        'finalized': 'Finalized',
        'completed': 'Completed',
        'cancelled': 'Cancelled'
      };
      return map[status] || status;
    }

    function loadScript(src) {
      return new Promise(function(resolve, reject) {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Could not load PDF library: ' + src));
        document.head.appendChild(script);
      });
    }

    async function ensureJsPdf() {
      if (window.jspdf?.jsPDF) return;
      await loadScript('../../../assets/vendor/jspdf/jspdf.umd.min.js');
      await loadScript('../../../assets/vendor/jspdf/jspdf.plugin.autotable.min.js');
      if (!window.jspdf?.jsPDF) throw new Error('PDF library did not initialize.');
    }

    async function downloadPDF(manifestId, button) {
      const manifest = manifests.find(m => m.manifestId === manifestId);
      if (!manifest) {
        alert('Manifest not found. Refresh the page and try again.');
        return;
      }

      const originalText = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Generating...';

      try {
        await ensureJsPdf();
        const [{ jsPDF }, passengers, parcels] = await Promise.all([
          Promise.resolve(window.jspdf),
          window.bangkagoManifests.getPassengers(manifestId),
          window.bangkagoManifests.getParcels(manifestId)
        ]);
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const pageWidth = doc.internal.pageSize.getWidth();
        const margin = 14;

        doc.setFillColor(23, 42, 66);
        doc.rect(0, 0, pageWidth, 24, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.text('BangkaGo Manifest', margin, 11);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.text('Manifest ' + manifest.manifestId, margin, 18);
        doc.text('Generated ' + new Date().toLocaleString('en-PH'), pageWidth - margin, 18, { align: 'right' });
        doc.setTextColor(40, 40, 40);

        const details = [
          ['Vessel', manifest.bangkaName || 'Unassigned'],
          ['Bangkero', manifest.bangkeroName || 'Unknown'],
          ['Route', (manifest.departurePortName || 'Unknown') + ' to ' + (manifest.arrivalPortName || 'Unknown')],
          ['Departure', formatDate(manifest.actualDepartureTime)],
          ['Arrival', formatDate(manifest.actualArrivalTime)],
          ['Status', statusText(manifest.status)],
          ['Passengers', String(manifest.totalPassengersOnBoard ?? 0)],
          ['Parcels', String(manifest.totalParcelsOnBoard ?? 0)],
          ['Snapshot Created', formatDate(manifest.generatedAt)]
        ];

        doc.autoTable({
          startY: 30,
          head: [['Manifest Details', 'Value']],
          body: details,
          styles: { fontSize: 9, cellPadding: 2.5, overflow: 'linebreak' },
          headStyles: { fillColor: [23, 42, 66], textColor: 255, fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [242, 246, 250] },
          margin: { left: margin, right: margin }
        });

        let nextY = doc.lastAutoTable.finalY + 8;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text('Passenger List', margin, nextY);
        nextY += 3;
        if (passengers.length) {
          doc.autoTable({
            startY: nextY,
            head: [['#', 'Name', 'Weight (kg)', 'Boarded', 'Booking ID']],
            body: passengers.map((passenger, index) => [
              index + 1,
              passenger.passengerName || 'Unknown',
              passenger.actualWeightKg == null ? '—' : String(passenger.actualWeightKg),
              passenger.boardedAt ? formatDate(passenger.boardedAt) : 'No',
              passenger.bookingId || '—'
            ]),
            styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
            headStyles: { fillColor: [23, 42, 66], textColor: 255, fontStyle: 'bold' },
            alternateRowStyles: { fillColor: [242, 246, 250] },
            margin: { left: margin, right: margin }
          });
          nextY = doc.lastAutoTable.finalY + 8;
        } else {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.text('No passenger records.', margin, nextY + 5);
          nextY += 13;
        }

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        if (nextY > doc.internal.pageSize.getHeight() - 25) {
          doc.addPage();
          nextY = 20;
        }
        doc.text('Parcel List', margin, nextY);
        nextY += 3;
        if (parcels.length) {
          doc.autoTable({
            startY: nextY,
            head: [['#', 'Description', 'Weight (kg)', 'Loaded']],
            body: parcels.map((parcel, index) => [
              index + 1,
              parcel.parcelDescription || 'Unspecified',
              parcel.weightKg == null ? '—' : String(parcel.weightKg),
              parcel.loadedAt ? formatDate(parcel.loadedAt) : 'No'
            ]),
            styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
            headStyles: { fillColor: [0, 180, 216], textColor: 255, fontStyle: 'bold' },
            alternateRowStyles: { fillColor: [242, 246, 250] },
            margin: { left: margin, right: margin }
          });
        } else {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9);
          doc.text('No parcel records.', margin, nextY + 5);
        }

        const pageCount = doc.internal.getNumberOfPages();
        for (let page = 1; page <= pageCount; page++) {
          doc.setPage(page);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8);
          doc.setTextColor(120, 120, 120);
          doc.text('BangkaGo manifest | Page ' + page + ' of ' + pageCount, margin, doc.internal.pageSize.getHeight() - 8);
        }

        doc.save('BangkaGo-manifest-' + manifest.manifestId.slice(0, 8) + '.pdf');
      } catch (e) {
        console.error(e);
        alert('PDF export failed: ' + e.message);
      } finally {
        button.disabled = false;
        button.innerHTML = originalText;
      }
    }

    function renderManifests(data) {
      tableBody.innerHTML = "";

      if (data.length === 0) emptyState.classList.remove("d-none");
      else emptyState.classList.add("d-none");

      data.forEach(m => {
        const route = `${m.departurePortName || 'Unknown'} to ${m.arrivalPortName || 'Unknown'}`;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.manifestId.slice(0, 12)}...</td>
          <td>${m.bangkaName || 'Unassigned'}</td>
          <td>${m.bangkeroName || 'Unknown'}</td>
          <td>${formatDate(m.generatedAt)}</td>
          <td>${route}</td>
          <td>${m.totalPassengersOnBoard}</td>
          <td>${m.totalParcelsOnBoard}</td>
          <td><span class="badge ${statusBadge(m.status)}">${statusText(m.status)}</span></td>
          <td>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-outline-danger action-btn" onclick="downloadPDF('${m.manifestId}', this)" title="Export PDF">
                <i class="bi bi-file-earmark-pdf"></i> PDF
              </button>
            </div>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      resultCount.textContent = `Showing ${data.length} manifest record(s)`;
    }

    function runFilters() {
      const q = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;
      const date = dateFilter.value;

      const filtered = manifests.filter(m => {
        const textMatch =
          m.manifestId.toLowerCase().includes(q) ||
          (m.bangkaName || '').toLowerCase().includes(q) ||
          (m.bangkeroName || '').toLowerCase().includes(q) ||
          (m.departurePortName || '').toLowerCase().includes(q) ||
          (m.arrivalPortName || '').toLowerCase().includes(q);

        const statusMatch = status ? m.status === status : true;
        const dateMatch = date ? (m.generatedAt?.split('T')[0] === date) : true;

        return textMatch && statusMatch && dateMatch;
      });

      renderManifests(filtered);
    }

    async function loadManifests() {
      try {
        manifests = await window.bangkagoManifests.listAll({ limit: 100, includeCompleted: true });
        renderManifests(manifests);
      } catch (e) {
        console.error(e);
        emptyState.textContent = 'Error loading manifests: ' + e.message;
        emptyState.classList.remove("d-none");
      }
    }

    searchInput.addEventListener("input", runFilters);
    statusFilter.addEventListener("change", runFilters);
    dateFilter.addEventListener("change", runFilters);

    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      statusFilter.value = "";
      dateFilter.value = "";
      renderManifests(manifests);
    });

    // Make functions global for onclick
    window.downloadPDF = downloadPDF;

    window.bangkagoAuthReady.then(function(role) {
      if (role !== 'coastguard') return;

      window.bangkagoRealtime.subscribe('trip_manifest', null, loadManifests);
      window.bangkagoRealtime.subscribe('manifest_passengers', null, loadManifests);
      window.bangkagoRealtime.subscribe('manifest_parcels', null, loadManifests);
      loadManifests();
    }).catch(function(e) {
      console.error('Failed to initialize manifest export:', e);
      emptyState.textContent = 'Failed to initialize manifests: ' + e.message;
      emptyState.classList.remove('d-none');
    });
  </script>
</body>
</html>
