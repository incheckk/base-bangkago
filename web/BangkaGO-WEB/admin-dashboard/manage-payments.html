<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BangkaGo Admin — Manage Payments</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-theme.css"/>
  <script>
    (function () {
      try {
        var role = sessionStorage.getItem("bangkago_role");
        if (role !== "admin") throw new Error("unauthorized");
      } catch (e) {
        location.replace("../../bangkaGo-access.html");
      }
    })();
  </script>

  <style>
    .summary-box{border:1px solid var(--gray-200);border-radius:12px;background:var(--gray-50);padding:.7rem .85rem;}
  </style>
</head>
<body data-page="manage-payments">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Manage Payments</h6>
            <span class="muted-note">View transactions and generate professional payment reports</span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-4">
              <input id="paymentSearch" class="form-control" placeholder="Search payment ID, booking ID, payer">
            </div>
            <div class="col-md-3">
              <select id="paymentStatusFilter" class="form-select">
                <option value="">All Status</option>
                <option value="Paid">Paid</option>
                <option value="Pending">Pending</option>
                <option value="Failed">Failed</option>
                <option value="Refunded">Refunded</option>
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button id="paymentReset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0">
              <thead>
                <tr>
                  <th>Payment ID</th>
                  <th>Booking ID</th>
                  <th>Payer</th>
                  <th>Amount</th>
                  <th>Method</th>
                  <th>Status</th>
                  <th style="min-width: 240px;">Actions</th>
                </tr>
              </thead>
              <tbody id="payBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- VIEW PAYMENT MODAL -->
  <div class="modal fade" id="viewPaymentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">View Payment Details</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="paymentDetailsBox"></div>
      </div>
    </div>
  </div>

  <!-- GENERATE REPORT MODAL -->
  <div class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="reportForm">
        <div class="modal-header">
          <h5 class="modal-title">Generate Payment Report</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="summary-box mb-3">
            <div><strong>Payment ID:</strong> <span id="rPaymentId">-</span></div>
            <div><strong>Payer:</strong> <span id="rPayer">-</span></div>
            <div><strong>Amount:</strong> <span id="rAmount">-</span></div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label">From Date</label>
              <input type="date" id="rFrom" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">To Date</label>
              <input type="date" id="rTo" class="form-control" required>
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label">Report Type</label>
            <select id="rType" class="form-select">
              <option value="Transaction Summary">Transaction Summary</option>
              <option value="Detailed Audit">Detailed Audit</option>
              <option value="Collection Statement">Collection Statement</option>
            </select>
          </div>

          <div class="mb-0">
            <label class="form-label">Notes (optional)</label>
            <textarea id="rNotes" class="form-control" rows="3" placeholder="Add remarks for this report..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-dark">
            <i class="bi bi-file-earmark-text me-1"></i> Generate
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- REPORT RESULT MODAL -->
  <div class="modal fade" id="reportResultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Payment Report Generated</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="reportResultBox"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>`n  <script src="assets/js/admin-theme.js"></script>
  <script src="assets/js/layout-loader.js"></script>

  <script>
    const pays = [
      {id:'PAY-01', bid:'BKG-101', payer:'Maria Lopez', amt:450, method:'GCash', status:'Paid', date:'2026-04-15', ref:'GC-928371'},
      {id:'PAY-02', bid:'BKG-102', payer:'John Reyes', amt:300, method:'Cash', status:'Pending', date:'2026-04-16', ref:'CSH-00129'},
      {id:'PAY-03', bid:'BKG-103', payer:'Ella Tan', amt:750, method:'Card', status:'Paid', date:'2026-04-16', ref:'CRD-762510'},
      {id:'PAY-04', bid:'BKG-104', payer:'Nina Lim', amt:300, method:'GCash', status:'Failed', date:'2026-04-17', ref:'GC-771002'}
    ];

    let selectedIndex = null;

    const tbody = document.getElementById('payBody');
    const paymentSearch = document.getElementById('paymentSearch');
    const paymentStatusFilter = document.getElementById('paymentStatusFilter');

    const viewPaymentModal = new bootstrap.Modal('#viewPaymentModal');
    const reportModal = new bootstrap.Modal('#reportModal');
    const reportResultModal = new bootstrap.Modal('#reportResultModal');

    function peso(n){
      return `₱${Number(n).toLocaleString('en-PH', {minimumFractionDigits:2})}`;
    }

    function badge(status){
      if(status === 'Paid') return 'text-bg-success';
      if(status === 'Pending') return 'text-bg-warning';
      if(status === 'Failed') return 'text-bg-danger';
      return 'text-bg-info';
    }

    function render(data){
      tbody.innerHTML = '';
      data.forEach(p => {
        const i = pays.findIndex(x => x.id === p.id);
        tbody.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.bid}</td>
            <td>${p.payer}</td>
            <td>${peso(p.amt)}</td>
            <td>${p.method}</td>
            <td><span class="badge ${badge(p.status)}">${p.status}</span></td>
            <td>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-primary action-btn" onclick="viewPayment(${i})">
                  <i class="bi bi-eye"></i> View Payment
                </button>
                <button class="btn btn-sm btn-outline-dark action-btn" onclick="openReport(${i})">
                  <i class="bi bi-file-earmark-text"></i> Generate Report
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    function runFilter(){
      const q = paymentSearch.value.toLowerCase().trim();
      const s = paymentStatusFilter.value;

      const filtered = pays.filter(p => {
        const textMatch =
          p.id.toLowerCase().includes(q) ||
          p.bid.toLowerCase().includes(q) ||
          p.payer.toLowerCase().includes(q);

        const statusMatch = s ? p.status === s : true;
        return textMatch && statusMatch;
      });

      render(filtered);
    }

    window.viewPayment = function(i){
      const p = pays[i];
      document.getElementById('paymentDetailsBox').innerHTML = `
        <div class="summary-box mb-2"><strong>Payment ID:</strong> ${p.id}</div>
        <div class="summary-box mb-2"><strong>Booking ID:</strong> ${p.bid}</div>
        <div class="summary-box mb-2"><strong>Payer:</strong> ${p.payer}</div>
        <div class="summary-box mb-2"><strong>Amount:</strong> ${peso(p.amt)}</div>
        <div class="summary-box mb-2"><strong>Method:</strong> ${p.method}</div>
        <div class="summary-box mb-2"><strong>Status:</strong> ${p.status}</div>
        <div class="summary-box mb-0"><strong>Reference:</strong> ${p.ref}</div>
      `;
      viewPaymentModal.show();
    }

    window.openReport = function(i){
      selectedIndex = i;
      const p = pays[i];

      document.getElementById('rPaymentId').textContent = p.id;
      document.getElementById('rPayer').textContent = p.payer;
      document.getElementById('rAmount').textContent = peso(p.amt);

      // default date range
      document.getElementById('rFrom').value = p.date;
      document.getElementById('rTo').value = p.date;
      document.getElementById('rType').value = 'Transaction Summary';
      document.getElementById('rNotes').value = '';

      reportModal.show();
    }

    document.getElementById('reportForm').addEventListener('submit', function(e){
      e.preventDefault();
      if(selectedIndex === null) return;

      const p = pays[selectedIndex];
      const from = document.getElementById('rFrom').value;
      const to = document.getElementById('rTo').value;
      const type = document.getElementById('rType').value;
      const notes = document.getElementById('rNotes').value.trim();

      if(from > to){
        alert('Invalid date range: "From Date" cannot be later than "To Date".');
        return;
      }

      reportModal.hide();

      document.getElementById('reportResultBox').innerHTML = `
        <div class="alert alert-success">
          <strong>${type}</strong> generated successfully.
        </div>

        <div class="summary-box mb-2"><strong>Payment ID:</strong> ${p.id}</div>
        <div class="summary-box mb-2"><strong>Payer:</strong> ${p.payer}</div>
        <div class="summary-box mb-2"><strong>Booking ID:</strong> ${p.bid}</div>
        <div class="summary-box mb-2"><strong>Amount:</strong> ${peso(p.amt)}</div>
        <div class="summary-box mb-2"><strong>Date Range:</strong> ${from} to ${to}</div>
        <div class="summary-box mb-0"><strong>Notes:</strong> ${notes || '-'}</div>

        <div class="mt-3 d-grid">
          <button class="btn btn-outline-dark" onclick="alert('Download started (demo).')">
            <i class="bi bi-download me-1"></i> Download Report
          </button>
        </div>
      `;

      reportResultModal.show();
    });

    paymentSearch.addEventListener('input', runFilter);
    paymentStatusFilter.addEventListener('change', runFilter);

    document.getElementById('paymentReset').addEventListener('click', () => {
      paymentSearch.value = '';
      paymentStatusFilter.value = '';
      render(pays);
    });

    render(pays);
  </script>
</body>
</html>
