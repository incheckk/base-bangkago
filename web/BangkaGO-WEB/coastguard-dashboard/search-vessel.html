<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Coast Guard — Search Vessel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/coastguard-theme.css"/>
</head>
<body data-page="search-vessel">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main" id="cgMain">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="row g-3">
          <div class="col-12">
            <div class="cg-card">
              <div class="panel-head">
                <h6 class="mb-0">Search Vessel (Read-Only)</h6>
                <span class="readonly-pill"><i class="bi bi-eye-fill"></i> Read Only</span>
              </div>

              <!-- Search controls -->
              <div class="row g-2 mb-3 align-items-end filter-row">
                <div class="col-12 col-md-5">
                  <label class="form-label visually-hidden" for="searchInput">Search</label>
                  <input id="searchInput" class="form-control w-100" type="text" placeholder="Search by Vessel name, permit, operator">
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label visually-hidden" for="statusFilter">Tracking Status</label>
                  <select id="statusFilter" class="form-select w-100">
                    <option value="">All Status</option>
                    <option value="online">Online (Recent Ping)</option>
                    <option value="stale">Stale Signal</option>
                    <option value="offline">Offline</option>
                  </select>
                </div>
                <div class="col-6 col-md-4 d-flex gap-2">
                  <button id="searchBtn" class="btn btn-primary flex-fill" type="button">
                    <i class="bi bi-search"></i> Search
                  </button>
                  <button id="resetBtn" class="btn btn-outline-secondary flex-fill" type="button">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                  </button>
                </div>
              </div>

              <div id="resultCount" class="small text-secondary mb-2"></div>

              <!-- Results table -->
              <div class="table-responsive">
                <table class="table table-theme align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Vessel ID</th>
                      <th>Name</th>
                      <th>Type</th>
                      <th>Capacity</th>
                      <th>Operator</th>
                      <th>Last Ping</th>
                      <th>Location</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="vesselTableBody"></tbody>
                </table>
              </div>

              <p id="emptyState" class="cg-empty d-none">
                No vessels found for your search.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../../assets/js/services/supabase.js"></script>
  <script src="../../../assets/js/services/bangkas.js"></script>
  <script src="../../../assets/js/services/vessels.js"></script>
  <script src="../../../assets/js/services/bangkeros.js"></script>
  <script src="../../../assets/js/services/realtime.js"></script>

  <script>
    let vessels = [];
    let vesselLocations = new Map();

    const tbody = document.getElementById("vesselTableBody");
    const searchInput = document.getElementById("searchInput");
    const statusFilter = document.getElementById("statusFilter");
    const searchBtn = document.getElementById("searchBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resultCount = document.getElementById("resultCount");
    const emptyState = document.getElementById("emptyState");

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        return new Date(dateStr).toLocaleString('en-PH', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function badgeClass(status) {
      if (status === "Online") return "text-bg-success";
      if (status === "Stale") return "text-bg-warning";
      return "text-bg-secondary";
    }

    function computeStatus(vessel, location) {
      if (!location) return 'Offline';
      const age = Date.now() - new Date(location.recordedAt).getTime();
      if (age < 60000) return 'Online';       // < 1 min
      if (age < 300000) return 'Stale';       // < 5 min
      return 'Offline';
    }

    function renderRows(data) {
      tbody.innerHTML = "";
      if (data.length === 0) {
        emptyState.classList.remove("d-none");
      } else {
        emptyState.classList.add("d-none");
      }

      data.forEach(v => {
        const location = vesselLocations.get(v.bangkaId);
        const status = computeStatus(v, location);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${v.bangkaId.slice(0, 8)}</td>
          <td><strong>${v.bangkaName}</strong></td>
          <td>${v.bangkaType || '—'}</td>
          <td>${v.capacity || '—'}</td>
          <td>${v.bangkeroName || 'Unassigned'}</td>
          <td>${location ? formatDate(location.recordedAt) : 'Never'}</td>
          <td>${location ? (location.latitude.toFixed(4) + ', ' + location.longitude.toFixed(4)) : 'Unknown'}</td>
          <td><span class="badge ${badgeClass(status)}">${status}</span></td>
        `;
        tbody.appendChild(tr);
      });

      resultCount.textContent = `Showing ${data.length} vessel(s)`;
    }

    function runSearch() {
      const q = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;

      const filtered = vessels.filter(v => {
        const textMatch =
          v.bangkaId.toLowerCase().includes(q) ||
          v.bangkaName.toLowerCase().includes(q) ||
          v.bangkaType?.toLowerCase().includes(q) ||
          v.bangkeroName?.toLowerCase().includes(q) ||
          v.permitNumber?.toLowerCase().includes(q);

        const location = vesselLocations.get(v.bangkaId);
        const computedStatus = computeStatus(v, location);
        const statusMatch = status ? computedStatus === status : true;
        return textMatch && statusMatch;
      });

      renderRows(filtered);
    }

    async function loadVessels() {
      try {
        const [bangkas, locations] = await Promise.all([
          window.bangkagoBangkas.listAll({}),
          window.bangkagoVessels.getAllLatestPositions()
        ]);
        vessels = bangkas;
        vesselLocations.clear();
        locations.forEach(loc => vesselLocations.set(loc.bangkaId, loc));
        renderRows(vessels);
      } catch (e) {
        console.error(e);
        emptyState.textContent = 'Error loading vessels: ' + e.message;
        emptyState.classList.remove("d-none");
      }
    }

    searchBtn.addEventListener("click", runSearch);
    resetBtn.addEventListener("click", () => {
      searchInput.value = "";
      statusFilter.value = "";
      renderRows(vessels);
    });
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });

    window.bangkagoAuthReady.then(function(role) {
      if (role !== 'coastguard') return;

      window.bangkagoRealtime.subscribe('bangkas', null, loadVessels);
      window.bangkagoRealtime.subscribe('vessel_tracking', null, loadVessels);
      window.bangkagoRealtime.subscribe('bangkeros', null, loadVessels);
      loadVessels();
    }).catch(function(e) {
      console.error('Failed to initialize vessel search:', e);
      emptyState.textContent = 'Failed to initialize vessel data: ' + e.message;
      emptyState.classList.remove('d-none');
    });
  </script>
</body>
</html>
