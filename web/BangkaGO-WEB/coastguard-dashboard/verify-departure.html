<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Coast Guard — Verify Departure</title>

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/css/coastguard-theme.css"/>
</head>
<body data-page="verify-departure">
  <div class="cg-shell">
    <div id="sidebarMount"></div>
    <main class="cg-main" id="cgMain">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="row g-3">
          <div class="col-12">
            <div class="cg-card">
              <div class="panel-head">
                <h6 class="mb-0">Departure Verification Log (Read-Only)</h6>
                <span class="readonly-pill"><i class="bi bi-eye-fill"></i> Read Only</span>
              </div>

              <!-- Search controls -->
              <div class="row g-2 mb-3 align-items-end filter-row">
                <div class="col-12 col-md-5">
                  <label class="form-label visually-hidden" for="verifySearchInput">Search</label>
                  <input id="verifySearchInput" class="form-control w-100" type="text" placeholder="Search by Ref No, vessel, port, or verifier">
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label visually-hidden" for="verifyStatusFilter">Result</label>
                  <select id="verifyStatusFilter" class="form-select w-100">
                    <option value="">All Results</option>
                    <option value="departed">Departed</option>
                    <option value="arrived">Arrived</option>
                    <option value="draft">Draft</option>
                    <option value="finalized">Finalized</option>
                    <option value="completed">Completed</option>
                  </select>
                </div>
                <div class="col-6 col-md-4 d-flex gap-2">
                  <button id="verifySearchBtn" class="btn btn-primary flex-fill" type="button">
                    <i class="bi bi-search"></i> Search
                  </button>
                  <button id="verifyResetBtn" class="btn btn-outline-secondary flex-fill" type="button">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                  </button>
                </div>
              </div>

              <div id="verifyResultCount" class="small text-secondary mb-2"></div>

              <!-- Table -->
              <div class="table-responsive">
                <table class="table table-theme align-middle mb-0">
                  <thead>
                    <tr>
                      <th>Manifest ID</th>
                      <th>Vessel</th>
                      <th>Bangkero</th>
                      <th>Route</th>
                      <th>Departure Time</th>
                      <th>Arrival Time</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody id="verifyTableBody"></tbody>
                </table>
              </div>

              <p id="verifyEmptyState" class="cg-empty d-none">
                No departure records found.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../../assets/js/services/supabase.js"></script>
  <script src="../../../assets/js/services/manifests.js"></script>
  <script src="../../../assets/js/services/realtime.js"></script>

  <script>
    let manifests = [];
    let selectedFilter = '';

    const input = document.getElementById("verifySearchInput");
    const filter = document.getElementById("verifyStatusFilter");
    const searchBtn = document.getElementById("verifySearchBtn");
    const resetBtn = document.getElementById("verifyResetBtn");
    const tbody = document.getElementById("verifyTableBody");
    const countEl = document.getElementById("verifyResultCount");
    const emptyEl = document.getElementById("verifyEmptyState");

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        return new Date(dateStr).toLocaleString('en-PH', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      } catch {
        return dateStr;
      }
    }

    function statusBadge(status) {
      const map = {
        'draft': 'text-bg-warning',
        'finalized': 'text-bg-info',
        'completed': 'text-bg-success',
        'cancelled': 'text-bg-danger'
      };
      return map[status] || 'text-bg-secondary';
    }

    function statusText(status) {
      const map = {
        'draft': 'Draft',
        'finalized': 'Finalized',
        'completed': 'Completed',
        'cancelled': 'Cancelled'
      };
      return map[status] || status;
    }

    function renderRows(data) {
      tbody.innerHTML = "";

      if (data.length === 0) {
        emptyEl.classList.remove("d-none");
      } else {
        emptyEl.classList.add("d-none");
      }

      data.forEach(m => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${m.manifestId.slice(0, 12)}...</td>
          <td>${m.bangkaName || 'Unassigned'}</td>
          <td>${m.bangkeroName || 'Unknown'}</td>
          <td>${m.departurePortName || 'Unknown'} to ${m.arrivalPortName || 'Unknown'}</td>
          <td>${formatDate(m.actualDepartureTime)}</td>
          <td>${formatDate(m.actualArrivalTime)}</td>
          <td><span class="badge ${statusBadge(m.status)}">${statusText(m.status)}</span></td>
        `;
        tbody.appendChild(tr);
      });

      countEl.textContent = `Showing ${data.length} record(s)`;
    }

    function runSearch() {
      const q = input.value.trim().toLowerCase();
      const status = filter.value;

      const filtered = manifests.filter(m => {
        const textMatch =
          m.manifestId.toLowerCase().includes(q) ||
          (m.bangkaName || '').toLowerCase().includes(q) ||
          (m.bangkeroName || '').toLowerCase().includes(q) ||
          (m.departurePortName || '').toLowerCase().includes(q) ||
          (m.arrivalPortName || '').toLowerCase().includes(q);

        const statusMatch = status ? m.status === status : true;
        return textMatch && statusMatch;
      });

      renderRows(filtered);
    }

    async function loadManifests() {
      try {
        manifests = await window.bangkagoManifests.listAll({ limit: 100, includeCompleted: true });
        renderRows(manifests);
      } catch (e) {
        console.error(e);
        emptyEl.textContent = 'Error loading manifests: ' + e.message;
        emptyEl.classList.remove("d-none");
      }
    }

    searchBtn.addEventListener("click", runSearch);
    resetBtn.addEventListener("click", () => {
      input.value = "";
      filter.value = "";
      renderRows(manifests);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });

    window.bangkagoAuthReady.then(function(role) {
      if (role !== 'coastguard') return;

      window.bangkagoRealtime.subscribe('trip_manifest', null, loadManifests);
      loadManifests();
    }).catch(function(e) {
      console.error('Failed to initialize departure verification:', e);
      emptyEl.textContent = 'Failed to initialize manifests: ' + e.message;
      emptyEl.classList.remove('d-none');
    });
  </script>
</body>
</html>
