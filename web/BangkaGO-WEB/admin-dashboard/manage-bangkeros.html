<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Admin — Manage Bangkeros</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-theme.css"/>
  <script>
    (function () {
      try {
        var role = sessionStorage.getItem("bangkago_role");
        if (role !== "admin") throw new Error("unauthorized");
      } catch (e) {
        location.replace("../../bangkaGo-access.html");
      }
    })();
  </script>
</head>
<body data-page="manage-bangkeros">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Manage Bangkeros</h6>
            <span class="muted-note">Review documents and decide application status</span>
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0" id="bangkeroTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Assigned Bangka</th>
                  <th>License</th>
                  <th>Application</th>
                  <th style="min-width: 200px;">Actions</th>
                </tr>
              </thead>
              <tbody id="bangkeroBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- REVIEW DOCUMENTS MODAL -->
  <div class="modal fade" id="reviewDocsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Review Documents</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <div><strong>Applicant:</strong> <span id="docApplicantName">-</span></div>
            <div><strong>Bangkero ID:</strong> <span id="docApplicantId">-</span></div>
            <div><strong>Assigned Bangka:</strong> <span id="docAssignedBangka">-</span></div>
          </div>

          <div class="list-group" id="docList"></div>

          <div class="alert alert-info mt-3 mb-0">
            <i class="bi bi-info-circle me-1"></i>
            Click any document to preview/download (currently demo links).
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MERGED APPROVE/REJECT MODAL -->
  <div class="modal fade" id="decisionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="decisionForm">
        <div class="modal-header">
          <h5 class="modal-title">Update Bangkero Application</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2"><strong>Applicant:</strong> <span id="decisionName">-</span></div>
          <div class="mb-3"><strong>ID:</strong> <span id="decisionId">-</span></div>

          <div class="mb-3">
            <label class="form-label">Decision</label>
            <select id="decisionSelect" class="form-select" required>
              <option value="Approved">Approve</option>
              <option value="Rejected">Reject</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">Remarks</label>
            <textarea id="decisionRemarks" class="form-control" rows="3" placeholder="Optional remarks..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-bangkago">Save Decision</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/admin-theme.js"></script>
  <script src="assets/js/layout-loader.js"></script>

  <script>
    const bangkeros = [
      {
        id:"BK-001",
        name:"Juan Dela Cruz",
        bangka:"Boat 08",
        license:"Valid",
        application:"Approved",
        remarks:"",
        documents:[
          {label:"Valid ID", url:"#"},
          {label:"Bangkero License", url:"#"},
          {label:"Medical Certificate", url:"#"},
          {label:"NBI Clearance", url:"#"}
        ]
      },
      {
        id:"BK-002",
        name:"Mario Santos",
        bangka:"Boat 03",
        license:"Valid",
        application:"Pending",
        remarks:"",
        documents:[
          {label:"Valid ID", url:"#"},
          {label:"Bangkero License", url:"#"},
          {label:"Medical Certificate", url:"#"}
        ]
      },
      {
        id:"BK-003",
        name:"Pedro Alonzo",
        bangka:"Boat 15",
        license:"Expired",
        application:"Rejected",
        remarks:"License expired",
        documents:[
          {label:"Valid ID", url:"#"},
          {label:"Expired License", url:"#"},
          {label:"Barangay Clearance", url:"#"}
        ]
      }
    ];

    const bangkeroBody = document.getElementById("bangkeroBody");

    const reviewDocsModal = new bootstrap.Modal(document.getElementById("reviewDocsModal"));
    const decisionModal = new bootstrap.Modal(document.getElementById("decisionModal"));

    const docApplicantName = document.getElementById("docApplicantName");
    const docApplicantId = document.getElementById("docApplicantId");
    const docAssignedBangka = document.getElementById("docAssignedBangka");
    const docList = document.getElementById("docList");

    const decisionName = document.getElementById("decisionName");
    const decisionId = document.getElementById("decisionId");
    const decisionSelect = document.getElementById("decisionSelect");
    const decisionRemarks = document.getElementById("decisionRemarks");
    const decisionForm = document.getElementById("decisionForm");

    let selectedIndex = null;

    function appBadge(status){
      if(status === "Approved") return "text-bg-success";
      if(status === "Rejected") return "text-bg-danger";
      return "text-bg-warning";
    }

    function renderTable(){
      bangkeroBody.innerHTML = "";
      bangkeros.forEach((b, i) => {
        bangkeroBody.innerHTML += `
          <tr>
            <td>${b.id}</td>
            <td>${b.name}</td>
            <td>${b.bangka}</td>
            <td>${b.license}</td>
            <td><span class="badge ${appBadge(b.application)}">${b.application}</span></td>
            <td>
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary" onclick="openReviewDocs(${i})">
                  <i class="bi bi-file-earmark-text"></i> Review
                </button>
                <button class="btn btn-sm btn-bangkago" onclick="openDecisionModal(${i})">
                  <i class="bi bi-check2-square"></i> Update Application
                </button>
              </div>
            </td>
          </tr>
        `;
      });
    }

    window.openReviewDocs = function(index){
      const b = bangkeros[index];
      docApplicantName.textContent = b.name;
      docApplicantId.textContent = b.id;
      docAssignedBangka.textContent = b.bangka;

      docList.innerHTML = b.documents.map(d => `
        <a href="${d.url}" target="_blank" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
          <span><i class="bi bi-file-earmark me-2"></i>${d.label}</span>
          <i class="bi bi-box-arrow-up-right"></i>
        </a>
      `).join("");

      reviewDocsModal.show();
    }

    window.openDecisionModal = function(index){
      selectedIndex = index;
      const b = bangkeros[index];

      decisionName.textContent = b.name;
      decisionId.textContent = b.id;
      decisionSelect.value = b.application === "Pending" ? "Approved" : b.application;
      decisionRemarks.value = b.remarks || "";

      decisionModal.show();
    }

    decisionForm.addEventListener("submit", function(e){
      e.preventDefault();
      if(selectedIndex === null) return;

      bangkeros[selectedIndex].application = decisionSelect.value;
      bangkeros[selectedIndex].remarks = decisionRemarks.value.trim();

      renderTable();
      decisionModal.hide();

      alert(`Application updated: ${bangkeros[selectedIndex].name} → ${decisionSelect.value}`);
    });

    renderTable();
  </script>
</body>
</html>
