<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangkaGo Admin — Manage Users</title>
  <link rel="icon" type="image/png" href="../../images/favicon.png" />

  <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/bootstrap-icons/css/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="../../assets/vendor/fonts/fonts.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin-theme.css"/>
  
</head>
<body data-page="manage-users">
  <div class="cg-shell">
    <div id="sidebarMount"></div>

    <main class="cg-main" id="cgMain">
      <div id="topbarMount"></div>

      <section class="cg-content container-fluid">
        <div class="cg-card p-3">
          <div class="panel-head">
            <h6 class="mb-0">Manage Users</h6>
            <span class="muted-note">User directory and account controls</span>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-4">
              <input id="userSearch" class="form-control" placeholder="Search name or phone">
            </div>
            <div class="col-md-3">
              <select id="roleFilter" class="form-select">
                <option value="">All Roles</option>
                <option value="admin">Admin</option>
                <option value="coastguard">Coast Guard</option>
                <option value="bangkero">Bangkero</option>
                <option value="passenger">Passenger</option>
              </select>
            </div>
            <div class="col-md-3">
              <select id="statusFilter" class="form-select">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="suspended">Suspended</option>
                <option value="deleted">Deleted</option>
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button id="userReset" class="btn btn-outline-secondary">Reset</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-theme align-middle mb-0">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Phone</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Joined</th>
                  <th style="min-width: 200px;">Actions</th>
                </tr>
              </thead>
              <tbody id="usersBody"></tbody>
            </table>
          </div>
          
          <div id="loadingState" class="text-center py-4 d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
            <p class="mt-2 text-muted">Loading users...</p>
          </div>
          
          <div id="errorState" class="alert alert-danger d-none" role="alert"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- UPDATE STATUS MODAL -->
  <div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="statusForm">
        <div class="modal-header">
          <h5 class="modal-title">Update User Status</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2"><strong>User:</strong> <span id="statusUserLabel">-</span></div>
          <div class="mb-3">
            <label class="form-label">New Status</label>
            <select id="newStatus" class="form-select" required>
              <option value="active">Active</option>
              <option value="suspended">Suspended</option>
            </select>
          </div>
          <div class="muted-note">
            A suspended account cannot sign in to the mobile app or this portal. Reactivate it here to restore access.
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-bangkago">Save Status</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ASSIGN ROLE MODAL -->
  <div class="modal fade" id="roleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="roleForm">
        <div class="modal-header">
          <h5 class="modal-title">Assign User Role</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2"><strong>User:</strong> <span id="roleUserLabel">-</span></div>
          <div class="mb-3">
            <label class="form-label">New Role</label>
            <select id="newRole" class="form-select" required>
              <option value="admin">Admin</option>
              <option value="coastguard">Coast Guard</option>
              <option value="bangkero">Bangkero</option>
              <option value="passenger">Passenger</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Notes</label>
            <textarea id="roleNotes" class="form-control" rows="3" placeholder="Optional note..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-outline-dark">Assign Role</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/admin-theme.js"></script>
  <script src="../assets/js/layout-loader.js"></script>
  <!-- Service scripts -->
  <script src="../../assets/js/services/supabase.js"></script>
  <script src="../../assets/js/services/users.js"></script>
  <script src="../../assets/js/services/realtime.js"></script>

  <script>
    let users = [];
    let selectedUid = null;

    const usersBody = document.getElementById('usersBody');
    const userSearch = document.getElementById('userSearch');
    const roleFilter = document.getElementById('roleFilter');
    const statusFilter = document.getElementById('statusFilter');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    const statusModal = new bootstrap.Modal(document.getElementById("statusModal"));
    const roleModal = new bootstrap.Modal(document.getElementById("roleModal"));

    const statusUserLabel = document.getElementById("statusUserLabel");
    const roleUserLabel = document.getElementById("roleUserLabel");
    const newStatus = document.getElementById("newStatus");
    const newRole = document.getElementById("newRole");
    const roleNotes = document.getElementById("roleNotes");

    function roleBadge(role) {
      const badges = {
        'admin': 'text-bg-dark',
        'coastguard': 'text-bg-primary',
        'bangkero': 'text-bg-warning',
        'passenger': 'text-bg-success'
      };
      return badges[role] || 'text-bg-secondary';
    }

    function statusBadge(statusKey) {
      if (statusKey === 'active') return 'text-bg-success';
      if (statusKey === 'suspended') return 'text-bg-danger';
      return 'text-bg-secondary';
    }

    function statusLabel(statusKey) {
      if (statusKey === 'active') return 'Active';
      if (statusKey === 'suspended') return 'Suspended';
      return 'Deleted';
    }

    // One source of truth for the badge and the filter. Deleted wins because
    // a deleted bangkero cannot sign in even when is_suspended is false.
    function accountStatus(u) {
      if (u.bangkeroDeleted) return 'deleted';
      return u.isSuspended ? 'suspended' : 'active';
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'N/A';
      try {
        // Date only, pinned to Philippine time: the DB stores UTC, and an
        // admin browsing from another timezone must still see the day the
        // account was registered.
        return new Date(dateStr).toLocaleDateString('en-PH', {
          month: 'short', day: 'numeric', year: 'numeric', timeZone: 'Asia/Manila'
        });
      } catch {
        return dateStr;
      }
    }

    function mapUserForDisplay(u) {
      return {
        uid: u.uid,
        name: ((u.firstName || '') + ' ' + (u.lastName || '')).trim(),
        phone: u.phone || 'N/A',
        role: u.role || 'Unknown',
        isSuspended: u.isSuspended === true,
        bangkeroDeleted: u.bangkeroDeleted === true,
        createdAt: u.createdAt
      };
    }

    function showLoading(show) {
      loadingState.classList.toggle('d-none', !show);
      errorState.classList.add('d-none');
    }

    function showError(msg) {
      loadingState.classList.add('d-none');
      errorState.textContent = msg;
      errorState.classList.remove('d-none');
    }

    function esc(value) {
      return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function(ch) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
      });
    }

    function renderTable(data) {
      usersBody.innerHTML = data.map((u) => {
        const key = accountStatus(u);
        return `
          <tr>
            <td>${esc(u.name)}</td>
            <td>${esc(u.phone)}</td>
            <td><span class="badge ${roleBadge(u.role)}">${u.role.charAt(0).toUpperCase() + u.role.slice(1)}</span></td>
            <td><span class="badge ${statusBadge(key)}">${statusLabel(key)}</span></td>
            <td>${formatDate(u.createdAt)}</td>
            <td>
              <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-dark action-btn" onclick="openStatusModal('${u.uid}')"
                        ${key === 'deleted' ? 'disabled title="Deleted bangkeros are restored from Manage Bangkeros."' : ''}>
                  <i class="bi bi-toggle-on"></i> Status
                </button>
                ${key === 'active' ? `
                <a href="suspend-user.html?userId=${u.uid}" class="btn btn-sm btn-outline-danger action-btn">
                  <i class="bi bi-person-x"></i> Suspend
                </a>` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function runFilter() {
      const q = userSearch.value.toLowerCase().trim();
      const r = roleFilter.value;
      const s = statusFilter.value;

      const filtered = users.filter(u => {
        const match = u.name.toLowerCase().includes(q) || u.phone.toLowerCase().includes(q);
        const roleMatch = r ? u.role === r : true;
        const statusMatch = s ? accountStatus(u) === s : true;
        return match && roleMatch && statusMatch;
      });

      renderTable(filtered);
    }

    // Looked up by uid: the table renders the FILTERED list, so a row
    // index would select a different user whenever a search is active.
    window.openStatusModal = function(uid) {
      const u = users.find(x => x.uid === uid);
      if (!u) return;
      if (accountStatus(u) === 'deleted') return;
      selectedUid = uid;
      statusUserLabel.textContent = `${u.name} (${u.phone})`;
      newStatus.value = u.isSuspended ? 'suspended' : 'active';
      statusModal.show();
    }

    window.openRoleModal = function(uid) {
      const u = users.find(x => x.uid === uid);
      if (!u) return;
      selectedUid = uid;
      roleUserLabel.textContent = `${u.name} (${u.phone})`;
      newRole.value = u.role;
      roleNotes.value = "";
      roleModal.show();
    }

    document.getElementById("statusForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const u = users.find(x => x.uid === selectedUid);
      if (!u) return;

      const newStatusVal = newStatus.value;

      try {
        await window.bangkagoUsers.setSuspended(u.uid, newStatusVal === 'suspended');
        u.isSuspended = (newStatusVal === 'suspended');
        runFilter();
        statusModal.hide();
        alert("User status updated.");
      } catch(e) {
        alert('Error: ' + e.message);
      }
    });

    document.getElementById("roleForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const u = users.find(x => x.uid === selectedUid);
      if (!u) return;

      const newRoleVal = newRole.value;

      try {
        await window.bangkagoUsers.assignRole(u.uid, newRoleVal);
        u.role = newRoleVal;
        runFilter();
        roleModal.hide();
        alert("User role assigned.");
      } catch(e) {
        alert('Error: ' + e.message);
      }
    });

    userSearch.addEventListener('input', runFilter);
    roleFilter.addEventListener('change', runFilter);
    statusFilter.addEventListener('change', runFilter);

    document.getElementById('userReset').addEventListener('click', () => {
      userSearch.value = "";
      roleFilter.value = "";
      statusFilter.value = "";
      renderTable(users);
    });

    async function loadUsers() {
      showLoading(true);
      try {
        users = await window.bangkagoUsers.listAll();
        // Map for display
        users = users.map(mapUserForDisplay);
        renderTable(users);
        showLoading(false);
      } catch(e) {
        console.error(e);
        showError('Failed to load users: ' + e.message);
      }
    }

    // Real-time updates
    window.bangkagoRealtime.subscribe('users', null, function() {
      loadUsers();
    });

    // Initial load — wait for auth guard to complete and session to restore
    (async function () {
      try {
        await window.bangkagoAuthReady;
        await loadUsers();
      } catch (e) {
        console.error('Auth guard failed:', e);
        showError('Could not load users (connection problem). Retrying...');
        setTimeout(loadUsers, 3000);
      }
    })();
  </script>
</body>
</html>
